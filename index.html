<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O2O 판매 분석 AI | Enterprise BI Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }

    /* Tables */
    .data-table-container { overflow-x: auto; border-radius: 0.75rem; border: 1px solid #e2e8f0; }
    .dark .data-table-container { border-color: #334155; }
    table { width: 100%; text-align: left; border-collapse: collapse; }
    th { background: #f8fafc; padding: 12px 16px; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    .dark th { background: #1e293b; color: #94a3b8; border-color: #334155; }
    td { padding: 12px 16px; font-size: 0.875rem; color: #334155; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
    .dark td { color: #cbd5e1; border-color: #1e293b; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: #f8fafc; }
    .dark tr:hover td { background-color: #0f172a; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    
    .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
    .dark .glass-panel { background: rgba(15, 23, 42, 0.95); border-color: rgba(51, 65, 85, 0.8); }
    
    .stat-card { transition: transform 0.2s, box-shadow 0.2s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
            panelbg: '#111827',
            panelborder: '#1f2937'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

  <header class="sticky top-0 z-40 glass-panel shadow-sm">
    <div class="px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="sidebarToggle" onclick="toggleSidebar()" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors flex items-center justify-center mr-1" aria-label="Toggle Sidebar" title="사이드바 접기/펼치기">
          <i class="fa-solid fa-bars text-sm"></i>
        </button>
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-chart-line text-sm"></i>
        </div>
        <div>
          <h1 class="text-base font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-indigo-600 dark:from-brand-400 dark:to-indigo-400">O2O 판매 분석 AI</h1>
          <p class="text-[10px] font-medium text-slate-500 dark:text-slate-400 uppercase tracking-widest -mt-0.5">Enterprise BI Platform</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button id="themeToggle" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors flex items-center justify-center" aria-label="Toggle Theme">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:block"></i>
        </button>
      </div>
    </div>
  </header>

  <div id="clearModal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-6">
    <div class="bg-white dark:bg-panelbg border border-slate-200 dark:border-panelborder p-5 rounded-2xl shadow-2xl max-w-sm w-full space-y-3 text-center">
      <div class="w-10 h-10 bg-rose-100 dark:bg-rose-900/50 text-rose-600 dark:text-rose-400 rounded-full mx-auto flex items-center justify-center text-lg">
        <i class="fa-solid fa-trash-can"></i>
      </div>
      <h3 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white">로컬 DB 초기화</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 font-normal">저장된 모든 누적 데이터를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.</p>
      <div class="flex items-center gap-2.5 pt-1">
        <button onclick="hideClearModal()" class="flex-1 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-semibold py-2 rounded-xl">취소</button>
        <button onclick="confirmClearDB()" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold py-2 rounded-xl shadow-md">초기화 진행</button>
      </div>
    </div>
  </div>

  <div class="flex-1 flex overflow-hidden">
    <aside id="sidebar" class="w-72 flex-shrink-0 bg-white dark:bg-[#111827] border-r border-slate-200 dark:border-slate-800 flex flex-col h-[calc(100vh-64px)] overflow-y-auto z-10 hidden md:flex transition-all duration-300 ease-in-out">
      <div class="p-5 space-y-6">
        <div>
          <h2 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3">🎛️ Data Control Center</h2>
          <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl border border-slate-100 dark:border-slate-700/50 space-y-3">
            <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-200">데이터 원천 업로드</h3>
            <label class="block w-full cursor-pointer group">
              <div class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-lg p-4 text-center transition-colors group-hover:border-brand-500 group-hover:bg-brand-50 dark:group-hover:bg-brand-900/20">
                <i class="fa-solid fa-file-excel text-2xl text-slate-400 group-hover:text-brand-500 mb-2 transition-colors"></i>
                <div class="text-xs font-medium text-slate-600 dark:text-slate-300">주차별/월별 Raw Excel 누적 추가</div>
                <div class="text-[10px] text-slate-400 mt-1">.xlsx, .xls 파일 지원 (다중 지원)</div>
              </div>
              <input type="file" id="fileUpload" multiple accept=".xlsx, .xls" class="hidden">
            </label>
            <div id="uploadStatus" class="text-xs font-medium text-emerald-600 dark:text-emerald-400 hidden mt-2 text-center"></div>
          </div>
        </div>

        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">통합 조건 선택</h2>
            <button onclick="clearFilters()" class="text-[10px] text-brand-600 dark:text-brand-400 font-medium hover:underline">필터 초기화</button>
          </div>
          
          <div class="space-y-1.5">
            <label class="text-[11px] font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
              <i class="fa-regular fa-calendar text-slate-400"></i> 조회 기간 설정 (미선택 시 전체)
            </label>
            <div class="flex items-center gap-2">
              <input type="date" id="filterStartDate" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-[11px] rounded-lg px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-brand-500">
              <span class="text-slate-400 text-xs">~</span>
              <input type="date" id="filterEndDate" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-[11px] rounded-lg px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-brand-500">
            </div>
          </div>

          <div class="space-y-1.5">
            <label class="text-[11px] font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
              <i class="fa-solid fa-shop text-slate-400"></i> 유통 채널
            </label>
            <select id="filterChannel" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 appearance-none">
              <option value="ALL">전체 채널</option>
            </select>
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
              <i class="fa-solid fa-location-dot text-slate-400"></i> 출고 지점
            </label>
            <select id="filterStore" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 appearance-none">
              <option value="ALL">전체 지점</option>
            </select>
          </div>
          <div class="space
