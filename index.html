  <meta charset="UTF-8">

  <!-- Tailwind CSS CDN -->

            }
          },

            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          }

    }
  </script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    body {
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .exec-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.03);

    .btn-flex-center {
      display: inline-flex;

</head>
<body class="custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const DB_NAME = 'ExecAI_DB';
    const DB_VERSION = 1;
    const STORE_NAME = 'session_data';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    };

    const saveToDB = async (key, data) => {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const req = store.put(data, key);
          req.onsuccess = () => resolve(true);
          req.onerror = (e) => reject(e.target.error);
        });
      } catch (err) {
        console.error('IndexedDB Save Error:', err);
      }
    };

    const getFromDB = async (key) => {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = (e) => reject(e.target.error);
        });
      } catch (err) {
        console.error('IndexedDB Get Error:', err);
        return null;
      }
    };

    const removeFromDB = async (key) => {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const req = store.delete(key);
          req.onsuccess = () => resolve(true);
          req.onerror = (e) => reject(e.target.error);
        });
      } catch (err) {
        console.error('IndexedDB Delete Error:', err);
      }
    };

    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide && window.lucide.icons) {
          const camelName = name.replace(/-([a-z0-9])/g, (g) => g[1].toUpperCase());
          const pascalName = camelName.charAt(0).toUpperCase() + camelName.slice(1);
          const iconObj = window.lucide.icons[name] || window.lucide.icons[pascalName] || window.lucide.icons[camelName];

          iconRef.current.innerHTML = '';
          if (iconObj && window.lucide.createElement) {
            const iconElem = window.lucide.createElement(iconObj);
            if (iconElem) {
              iconElem.setAttribute('class', className);
              iconRef.current.appendChild(iconElem);
            }
          }
        }
      }, [name, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0 p-0 m-0 leading-none self-center"></span>;
    };

    const parseNumeric = (val) => {
      if (val === null || val === undefined) return 0;
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      const cleaned = String(val).replace(/,/g, '').replace(/원/g, '').trim();
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : num;
    };

    const parseDateToYearMonth = (rawVal, fallbackYear = '2025', fallbackMonth = 1) => {
      if (!rawVal) return { year: fallbackYear, month: fallbackMonth };
      
      if (rawVal instanceof Date && !isNaN(rawVal.getTime())) {
        return { year: String(rawVal.getFullYear()), month: rawVal.getMonth() + 1 };
      }

      if (typeof rawVal === 'number' && rawVal > 30000 && rawVal < 60000) {
        const jsDate = new Date((rawVal - (25567 + 2)) * 86400 * 1000);
        if (!isNaN(jsDate.getTime())) {
          return { year: String(jsDate.getFullYear()), month: jsDate.getMonth() + 1 };
        }
      }

      const str = String(rawVal).trim();
      const krMatch = str.match(/(?:20)?(\d{2})\s*년\s*(\d{1,2})\s*월/);
      if (krMatch) return { year: '20' + krMatch[1], month: parseInt(krMatch[2], 10) };

      const stdMatch = str.match(/(20\d{2})[-./\s](\d{1,2})/);
      if (stdMatch) return { year: stdMatch[1], month: parseInt(stdMatch[2], 10) };

      const shortMatch = str.match(/^(\d{2})[-./\s](\d{1,2})/);
      if (shortMatch) return { year: '20' + shortMatch[1], month: parseInt(shortMatch[2], 10) };

      const digits = str.replace(/[^0-9]/g, '');
      if (digits.length >= 6) {
        const y = digits.substring(0, 4);
        const m = parseInt(digits.substring(4, 6), 10);
        if (parseInt(y) >= 2000 && parseInt(y) <= 2099 && m >= 1 && m <= 12) return { year: y, month: m };
      }

      return { year: fallbackYear, month: fallbackMonth };
    };

    const isValidText = (text) => {
      if (text === null || text === undefined) return false;
      const s = String(text).trim();
      if (s === '' || s === '-' || s.toLowerCase() === 'null' || s === '기타' || s === '미상' || s === 'undefined') return false;
      return true;
    };

    const formatRevenueDisplay = (rev) => {
      const num = parseNumeric(rev);
      if (num === 0) return '0원';
      const absNum = Math.abs(num);
      const prefix = num < 0 ? '-' : '';
      if (absNum >= 1000000) {
        return `${prefix}${(absNum / 1000000).toLocaleString(undefined, { maximumFractionDigits: 1 })}백만원`;
      }
      if (absNum >= 10000) {
        return `${prefix}${(absNum / 10000).toLocaleString(undefined, { maximumFractionDigits: 0 })}만원`;
      }
      return `${prefix}${absNum.toLocaleString()}원`;
    };

    const generateMultiYearData = () => {
      const rows = [];
      const products = [
        { name: '모던하우스 스웰 알러지케어 리버시블 베개커버 50x70 코니 크림핑크', cat: '침구/홈데코', price: 29000, brand: '모던하우스' },
        { name: '3층 리트머스 얇은원단 남여공용 오버핏 반팔 티셔츠 TU285-M-76', cat: '의류/상의', price: 19800, brand: '리트머스' },
        { name: 'Ultra AI 스마트폰 M3 Pro 256GB', cat: '스마트기기', price: 1500000, brand: '삼성전자' },
        { name: 'OLED 85인치 AI 매직 스크린 TV', cat: '가전', price: 4200000, brand: 'LG전자' },
        { name: 'MacBook Pro M3 Max 16인치', cat: 'IT/사무', price: 3400000, brand: '애플' }
      ];
      
      const branches = ['강남 직영점', '판교점', '센텀시티점', '동대구점', '광복점'];
      const channels = ['네이버 스마트스토어', '쿠팡', '공식 자사몰', '오프라인 매장', 'G마켓'];
      const colors = ['크림핑크', '화이트', '스페이스그레이', '네이비', '블랙'];
      const sizes = ['50x70', 'Standard', 'Pro', 'Max', 'FREE'];

      let id = 1;
      for (let year = 2023; year <= 2025; year++) {
        for (let month = 1; month <= 12; month++) {
          let seasonality = month === 11 || month === 12 ? 1.4 : month >= 6 && month <= 8 ? 1.3 : 1.0;
          const growth = 1 + (year - 2023) * 0.15;

          products.forEach(prod => {
            const txCount = Math.floor((Math.random() * 8 + 2) * seasonality);
            for (let i = 0; i < txCount; i++) {
              const isRefund = Math.random() < 0.05;
              const qty = (Math.floor(Math.random() * 4) + 1) * (isRefund ? -1 : 1);
              const revenue = prod.price * qty * growth;
              const cost = (prod.price * 0.6) * qty * growth;

              rows.push({
                'id': id++,
                '거래일자': `${year}년${month}월${Math.floor(Math.random() * 4 + 1)}주차`,
                '브랜드': prod.brand,
                '지점': branches[Math.floor(Math.random() * branches.length)],
                '판매채널': channels[Math.floor(Math.random() * channels.length)],
                '상품명': prod.name,
                '컬러': colors[Math.floor(Math.random() * colors.length)],
                '사이즈': sizes[Math.floor(Math.random() * sizes.length)],
                '수량': qty,
                '매출액': Math.round(revenue),
                '원가': Math.round(cost)
              });
            }
          });
        }
      }
      return rows;
    };

    function App() {
      const [originalRawData, setOriginalRawData] = useState([]);
      const [rawData, setRawData] = useState([]);
      const [uploadedFileKeys, setUploadedFileKeys] = useState(new Set());
      const [activeTab, setActiveTab] = useState('DASHBOARD');
      const [toast, setToast] = useState(null);
      const [isInitialLoaded, setIsInitialLoaded] = useState(false);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const [mapping, setMapping] = useState({
        dateCol: '거래일자',
        revenueCol: '매출액',
        productCol: '상품명',
        brandCol: '브랜드',
        colorCol: '컬러',
        sizeCol: '사이즈',
        branchCol: '지점',
        channelCol: '판매채널',
        quantityCol: '수량'
      });

      const [apiKey, setApiKey] = useState('');

      useEffect(() => {
        const restoreSession = async () => {
          try {
            const savedKey = localStorage.getItem('EXEC_AI_API_KEY');
            const savedMap = localStorage.getItem('EXEC_AI_MAPPING');

            if (savedKey) setApiKey(savedKey);
            if (savedMap) setMapping(JSON.parse(savedMap));

            const savedRaw = await getFromDB('EXEC_AI_RAW_DATA');
            const savedOrig = await getFromDB('EXEC_AI_ORIG_DATA');
            const savedKeysArr = await getFromDB('EXEC_AI_FILE_KEYS');

            if (savedRaw && savedRaw.length > 0) {
              setRawData(savedRaw);
              setOriginalRawData(savedOrig || savedRaw);
              setUploadedFileKeys(savedKeysArr ? new Set(savedKeysArr) : new Set());
              setTimeout(() => {
                showToast(`이전 데이터 세션 ${savedRaw.length.toLocaleString()}건 및 맞춤 필드 매핑이 성공적으로 복원되었습니다.`);
              }, 400);
            }
          } catch (err) {
            console.error('저장 세션 복원 중 오류:', err);
          } finally {
            setIsInitialLoaded(true);
          }
        };

        restoreSession();
      }, []);

      useEffect(() => {
        if (!isInitialLoaded) return;
        const syncDB = async () => {
          try {
            if (rawData.length > 0) {
              await saveToDB('EXEC_AI_RAW_DATA', rawData);
              await saveToDB('EXEC_AI_ORIG_DATA', originalRawData);
              await saveToDB('EXEC_AI_FILE_KEYS', Array.from(uploadedFileKeys));
            } else {
              await removeFromDB('EXEC_AI_RAW_DATA');
              await removeFromDB('EXEC_AI_ORIG_DATA');
              await removeFromDB('EXEC_AI_FILE_KEYS');
            }
          } catch (err) {
            console.warn('IndexedDB 저장 오차:', err);
          }
        };
        syncDB();
      }, [rawData, originalRawData, uploadedFileKeys, isInitialLoaded]);

      useEffect(() => {
        if (!isInitialLoaded) return;
        try {
          localStorage.setItem('EXEC_AI_MAPPING', JSON.stringify(mapping));
        } catch (e) {}
      }, [mapping, isInitialLoaded]);

      const handleSaveApiKey = () => {
        try {
          if (apiKey.trim()) {
            localStorage.setItem('EXEC_AI_API_KEY', apiKey.trim());
            showToast('Gemini API 키가 안전하게 저장되었습니다.');
          } else {
            localStorage.removeItem('EXEC_AI_API_KEY');
            showToast('API 키가 삭제되었습니다.');
          }
        } catch (e) {}
        setIsApiModalOpen(false);
      };

      const [activeCleanings, setActiveCleanings] = useState({
        winsorizeAnomalies: false,
        removeNulls: false,
        fixZeroRevenues: false
      });

      const [isApiModalOpen, setIsApiModalOpen] = useState(false);
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { role: 'assistant', text: 'Executive AI Analyst 접속 완료. 업로드하신 로우데이터의 매출, 반품/취소 실적, 상품명/옵션/소재 키워드를 정밀 분석하여 답변해 드립니다.' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [savedChatInsights, setSavedChatInsights] = useState([]);
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [aiReport, setAiReport] = useState(null);
      const [reportType, setReportType] = useState('executive');

      const [productSortBy, setProductSortBy] = useState('revenue');
      const [isMappingModalOpen, setIsMappingModalOpen] = useState(false);
      const [simParams, setSimParams] = useState({ price: 0, marketing: 10, demand: 5 });

      const handleSaveMapping = () => {
        try {
          localStorage.setItem('EXEC_AI_MAPPING', JSON.stringify(mapping));
          showToast('필드 매핑 설정이 안전하게 저장되었습니다.');
        } catch (e) {}
        setIsMappingModalOpen(false);
      };

      const handleSaveInsight = (userQuestion, assistantAnswer) => {
        const newInsight = {
          id: Date.now(),
          question: userQuestion,
          answer: assistantAnswer,
          timestamp: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
        };
        setSavedChatInsights(prev => [...prev, newInsight]);
        showToast('유의미한 대화 인사이트가 경영 보고서에 성공적으로 추가되었습니다.');
      };

      const autoDetectMapping = (sampleRow, force = false) => {
        if (!sampleRow) return;

        let currentMap = { ...mapping };
        if (!force) {
          try {
            const savedMap = localStorage.getItem('EXEC_AI_MAPPING');
            if (savedMap) currentMap = JSON.parse(savedMap);
          } catch (e) {}
        }

        const keys = Object.keys(sampleRow);
        const newMap = { ...currentMap };

        keys.forEach(k => {
          const lower = k.toLowerCase();
          if (force || !newMap.dateCol) {
            if (lower.includes('일자') || lower.includes('날짜') || lower.includes('date')) newMap.dateCol = k;
          }
          if (force || !newMap.revenueCol) {
            if (lower.includes('매출') || lower.includes('금액') || lower.includes('revenue')) newMap.revenueCol = k;
          }
          if (force || !newMap.productCol) {
            if (lower.includes('상품') || lower.includes('제품') || lower.includes('item')) newMap.productCol = k;
          }
          if (force || !newMap.brandCol) {
            if (lower.includes('브랜드') || lower.includes('brand')) newMap.brandCol = k;
          }
          if (force || !newMap.branchCol) {
            if (lower.includes('지점') || lower.includes('점포') || lower.includes('매장')) newMap.branchCol = k;
          }
          if (force || !newMap.channelCol) {
            if (lower.includes('채널') || lower.includes('channel')) newMap.channelCol = k;
          }
          if (force || !newMap.quantityCol) {
            if (lower.includes('수량') || lower.includes('qty')) newMap.quantityCol = k;
          }
          if (force || !newMap.colorCol) {
            if (lower.includes('컬러') || lower.includes('색상')) newMap.colorCol = k;
          }
          if (force || !newMap.sizeCol) {
            if (lower.includes('사이즈') || lower.includes('규격')) newMap.sizeCol = k;
          }
        });
        setMapping(newMap);
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        if (!files || files.length === 0) return;

        let newlyParsedData = [];
        let filesProcessed = 0;
        let duplicateCount = 0;
        const currentKeys = new Set(uploadedFileKeys);
        const addedKeysThisBatch = [];

        const processUploadResults = () => {
          if (addedKeysThisBatch.length > 0) {
            addedKeysThisBatch.forEach(k => currentKeys.add(k));
            setUploadedFileKeys(currentKeys);
            setOriginalRawData(prev => [...prev, ...newlyParsedData]);
            setRawData(prev => [...prev, ...newlyParsedData]);
            setActiveCleanings({ winsorizeAnomalies: false, removeNulls: false, fixZeroRevenues: false });
            autoDetectMapping(newlyParsedData[0], false);

            let msg = `신규 파일 ${addedKeysThisBatch.length}개 (${newlyParsedData.length.toLocaleString()}건) 데이터가 성공적으로 반영되었습니다.`;
            if (duplicateCount > 0) {
              msg += ` (중복 파일 ${duplicateCount}개 제외)`;
            }
            showToast(msg);
          } else if (duplicateCount > 0) {
            showToast(`이미 업로드된 동일한 파일입니다. (중복 ${duplicateCount}개 제외됨)`, 'error');
          } else {
            showToast('유효한 데이터가 없습니다.', 'error');
          }
        };

        files.forEach((file) => {
          const fileKey = `${file.name}_${file.size}_${file.lastModified}`;
          if (currentKeys.has(fileKey)) {
            duplicateCount++;
            filesProcessed++;
            if (filesProcessed === files.length) processUploadResults();
            return;
          }

          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const bstr = evt.target.result;
              const wb = XLSX.read(bstr, { type: 'binary' });
              wb.SheetNames.forEach((sheetName) => {
                const sheetData = XLSX.utils.sheet_to_json(wb.Sheets[sheetName]);
                if (sheetData && sheetData.length > 0) {
                  newlyParsedData = newlyParsedData.concat(sheetData);
                }
              });
              addedKeysThisBatch.push(fileKey);
            } catch (err) {
              console.error(`파일 읽기 오류 (${file.name}):`, err);
            } finally {
              filesProcessed++;
              if (filesProcessed === files.length) processUploadResults();
            }
          };
          reader.readAsBinaryString(file);
        });
        e.target.value = '';
      };

      const handleResetData = async () => {
        setOriginalRawData([]);
        setRawData([]);
        setUploadedFileKeys(new Set());
        setAiReport(null);
        setActiveCleanings({ winsorizeAnomalies: false, removeNulls: false, fixZeroRevenues: false });
        
        await removeFromDB('EXEC_AI_RAW_DATA');
        await removeFromDB('EXEC_AI_ORIG_DATA');
        await removeFromDB('EXEC_AI_FILE_KEYS');

        showToast('저장된 데이터 세션 및 파일 이력이 완전히 초기화되었습니다.');
      };

      const handleLoadSampleData = () => {
        const sample = generateMultiYearData();
        setOriginalRawData(sample);
        setRawData(sample);
        autoDetectMapping(sample[0], true);
        showToast('체험용 샘플 데이터가 로드되었습니다.');
      };

      const analytics = useMemo(() => {
        if (!rawData || rawData.length === 0) return null;

        const keys = Object.keys(rawData[0]);
        let costKey = keys.find(k => k.match(/원가|매입가|cost/i));
        let profitKey = keys.find(k => k.match(/영업이익|순이익|profit/i));

        let totalRevenue = 0;
        let totalProfit = 0;
        let totalCost = 0;
        let totalQtySum = 0;
        let refundCount = 0;
        let refundTotalAmount = 0;
        let calculationMethod = '';
        let hasProfitOrCostData = false;

        const yearlyMap = {};
        const monthlyMap = {};
        const timelineMap = {};
        const productMap = {};
        const brandMap = {};
        const branchMap = {};
        const channelMap = {};
        const colorMap = {};
        const sizeMap = {};

        let missingValues = 0;

        rawData.forEach(row => {
          Object.values(row).forEach(v => {
            if (v === null || v === undefined || String(v).trim() === '') missingValues++;
          });

          const rev = parseNumeric(row[mapping.revenueCol]);
          let cost = 0;
          let profit = 0;

          if (rev < 0) {
            refundCount++;
            refundTotalAmount += Math.abs(rev);
          }

          if (profitKey && row[profitKey] !== undefined && row[profitKey] !== null) {
            profit = parseNumeric(row[profitKey]);
            cost = costKey && row[costKey] !== undefined ? parseNumeric(row[costKey]) : rev - profit;
            calculationMethod = '원본 데이터 [영업이익] 필드 직접 합산';
            hasProfitOrCostData = true;
          } else if (costKey && row[costKey] !== undefined && row[costKey] !== null) {
            cost = parseNumeric(row[costKey]);
            profit = rev - cost;
            calculationMethod = '매출액 - 원본 데이터 [원가] 차감 산출';
            hasProfitOrCostData = true;
          } else {
            profit = 0;
            cost = 0;
            calculationMethod = '로우데이터 내 원가/이익 필드가 없어 손익 지표 대신 건당 평균 매출액(AOV) 및 평균 단가(ASP) 제공';
            hasProfitOrCostData = false;
          }

          const qty = parseNumeric(row[mapping.quantityCol]) || 1;
          totalRevenue += rev;
          totalProfit += profit;
          totalCost += cost;
          totalQtySum += qty;

          const { year, month } = parseDateToYearMonth(row[mapping.dateCol]);
          const ym = `${year}-${String(month).padStart(2, '0')}`;

          yearlyMap[year] = (yearlyMap[year] || 0) + rev;
          monthlyMap[month] = (monthlyMap[month] || 0) + rev;
          timelineMap[ym] = (timelineMap[ym] || 0) + rev;

          const prod = isValidText(row[mapping.productCol]) ? String(row[mapping.productCol]).trim() : null;
          const brand = isValidText(row[mapping.brandCol]) ? String(row[mapping.brandCol]).trim() : null;
          const branch = isValidText(row[mapping.branchCol]) ? String(row[mapping.branchCol]).trim() : null;
          const channel = isValidText(row[mapping.channelCol]) ? String(row[mapping.channelCol]).trim() : null;
          const color = isValidText(row[mapping.colorCol]) ? String(row[mapping.colorCol]).trim() : null;
          const size = isValidText(row[mapping.sizeCol]) ? String(row[mapping.sizeCol]).trim() : null;

          if (prod) {
            if (!productMap[prod]) productMap[prod] = { revenue: 0, qty: 0, profit: 0, brand: brand || '-' };
            productMap[prod].revenue += rev;
            productMap[prod].qty += qty;
            productMap[prod].profit += profit;
          }
          if (brand) brandMap[brand] = (brandMap[brand] || 0) + rev;
          if (branch) branchMap[branch] = (branchMap[branch] || 0) + rev;
          if (channel) channelMap[channel] = (channelMap[channel] || 0) + rev;
          if (color) colorMap[color] = (colorMap[color] || 0) + Math.abs(qty);
          if (size) sizeMap[size] = (sizeMap[size] || 0) + Math.abs(qty);
        });

        const sortedYears = Object.keys(yearlyMap).sort();
        const latestYear = sortedYears[sortedYears.length - 1];
        const prevYear = sortedYears[sortedYears.length - 2];
        let yoyGrowth = null;
        let yoyText = "단일 연도 데이터 (비교 대상 전년도 데이터 미비)";

        if (prevYear && yearlyMap[prevYear] > 0) {
          yoyGrowth = ((yearlyMap[latestYear] - yearlyMap[prevYear]) / yearlyMap[prevYear]) * 100;
          yoyText = `YoY ${yoyGrowth > 0 ? '+' : ''}${yoyGrowth.toFixed(1)}% (${prevYear} 대비)`;
        }

        const sortedProducts = Object.entries(productMap)
          .map(([name, data]) => ({ name, ...data }))
          .sort((a, b) => b.revenue - a.revenue);

        let cumRev = 0;
        const productsABC = sortedProducts.map(p => {
          cumRev += p.revenue;
          const share = totalRevenue > 0 ? (p.revenue / totalRevenue) * 100 : 0;
          const cumShare = totalRevenue > 0 ? (cumRev / totalRevenue) * 100 : 0;
          let abc = 'C';
          if (cumShare <= 70) abc = 'A';
          else if (cumShare <= 90) abc = 'B';
          return { ...p, share, abc };
        });

        const classAProducts = productsABC.filter(p => p.abc === 'A');
        const classACount = classAProducts.length;
        const totalSKUCount = productsABC.length;

        const top20SKUCount = Math.max(1, Math.ceil(productsABC.length * 0.2));
        const top20Revenue = productsABC.slice(0, top20SKUCount).reduce((sum, p) => sum + p.revenue, 0);
        const top20Share = totalRevenue > 0 ? (top20Revenue / totalRevenue) * 100 : 0;
        const top20SKUPercent = totalSKUCount > 0 ? ((top20SKUCount / totalSKUCount) * 100).toFixed(1) : '0.0';

        const timelineArray = Object.entries(timelineMap).map(([ym, val]) => ({ ym, val }));
        const meanRev = timelineArray.reduce((sum, item) => sum + item.val, 0) / (timelineArray.length || 1);
        const stdDev = Math.sqrt(timelineArray.reduce((sum, item) => sum + Math.pow(item.val - meanRev, 2), 0) / (timelineArray.length || 1));
        
        const anomalies = timelineArray.map(item => {
          const zScore = stdDev > 0 ? (item.val - meanRev) / stdDev : 0;
          return { ...item, zScore };
        }).filter(item => Math.abs(item.zScore) >= 1.5);

        const actionItems = [];
        if (anomalies.length > 0) {
          const highestSpike = anomalies.sort((a, b) => b.zScore - a.zScore)[0];
          actionItems.push({
            title: `특이점 원인 분석 요망 (${highestSpike.ym})`,
            score: Math.min(99, Math.round(Math.abs(highestSpike.zScore) * 30)),
            desc: `${highestSpike.ym} 구간 변동 폭 가속. 프로모션/외부 변수 점검.`
          });
        }
        if (productsABC.length > 0 && productsABC[0].share > 30) {
           actionItems.push({
            title: `단일 품목 의존도 리스크`,
            score: 85,
            desc: `Class A 품목(${productsABC[0].name.substring(0, 15)}...)이 전체 매출의 ${productsABC[0].share.toFixed(1)}% 점유.`
          });
        }

        const getTop = (map, limit = 5) => Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, limit);

        const avgOrderValue = rawData.length > 0 ? Math.round(totalRevenue / rawData.length) : 0;
        const avgSellingPrice = totalQtySum > 0 ? Math.round(totalRevenue / totalQtySum) : 0;

        return {
          totalRevenue,
          totalProfit,
          hasProfitOrCostData,
          avgOrderValue,
          avgSellingPrice,
          profitMargin: totalRevenue > 0 ? (totalProfit / totalRevenue) * 100 : 0,
          refundCount,
          refundTotalAmount,
          calculationMethod,
          yoyGrowth,
          yoyText,
          sortedYears,
          yearlyMap,
          monthlyMap,
          productsABC,
          classACount,
          totalSKUCount,
          top20SKUCount,
          top20Share,
          top20SKUPercent,
          productMap,
          topBrands: getTop(brandMap, 5),
          topBranches: getTop(branchMap, 5),
          topChannels: getTop(channelMap, 5),
          topColor: getTop(colorMap, 1)[0]?.[0] || '데이터 없음',
          topSize: getTop(sizeMap, 1)[0]?.[0] || '데이터 없음',
          anomalies,
          actionItems,
          rowCount: rawData.length,
          missingValues
        };
      }, [rawData, mapping]);

      const applyDataCleaning = (type) => {
        if (!originalRawData || originalRawData.length === 0) return;

        let cleaned = [...rawData];

        if (type === 'winsorizeAnomalies') {
          if (analytics && analytics.anomalies.length > 0) {
            const anomalyDates = new Set(analytics.anomalies.map(a => a.ym));
            cleaned = cleaned.map(row => {
              const { year, month } = parseDateToYearMonth(row[mapping.dateCol]);
              const ym = `${year}-${String(month).padStart(2, '0')}`;
              if (anomalyDates.has(ym)) {
                const currentRev = parseNumeric(row[mapping.revenueCol]);
                return { ...row, [mapping.revenueCol]: Math.round(currentRev * 0.6) };
              }
              return row;
            });
            setActiveCleanings(prev => ({ ...prev, winsorizeAnomalies: true }));
            showToast('이상치 보정이 적용되었습니다.');
          } else {
            showToast('보정 대상 이상치가 없습니다.', 'error');
          }
        } else if (type === 'removeNulls') {
          cleaned = cleaned.filter(row => {
            const rev = parseNumeric(row[mapping.revenueCol]);
            const prod = row[mapping.productCol];
            return !isNaN(rev) && isValidText(prod);
          });
          setActiveCleanings(prev => ({ ...prev, removeNulls: true }));
          showToast('결측치 및 비정상 공백 레코드가 정제되었습니다.');
        } else if (type === 'fixZeroRevenues') {
          let totalValidRev = 0;
          let totalValidQty = 0;
          cleaned.forEach(row => {
            const r = parseNumeric(row[mapping.revenueCol]);
            const q = Math.abs(parseNumeric(row[mapping.quantityCol]));
            if (r > 0 && q > 0) {
              totalValidRev += r;
              totalValidQty += q;
            }
          });
          const avgUnitPrice = totalValidQty > 0 ? Math.round(totalValidRev / totalValidQty) : 30000;

          cleaned = cleaned.map(row => {
            const rev = parseNumeric(row[mapping.revenueCol]);
            const qty = parseNumeric(row[mapping.quantityCol]) || 1;
            if (rev === 0) {
              return { ...row, [mapping.revenueCol]: avgUnitPrice * Math.abs(qty), [mapping.quantityCol]: Math.abs(qty) };
            }
            return row;
          });
          setActiveCleanings(prev => ({ ...prev, fixZeroRevenues: true }));
          showToast(`0원 미입력 매출 보정 완료 (평균 단가 ${avgUnitPrice.toLocaleString()}원 적용, 취소건 보존)`);
        } else if (type === 'reset') {
          cleaned = [...originalRawData];
          setActiveCleanings({ winsorizeAnomalies: false, removeNulls: false, fixZeroRevenues: false });
          showToast('원본 데이터로 복원되었습니다.');
        }

        setRawData(cleaned);
      };

${topBranchesList}

                  <div>
                    <h3 className="font-bold text-slate-900 text-sm">데이터 필드 매핑 설정</h3>
                    <p className="text-xs text-slate-500 mt-1">지정한 필드 매핑 구조는 브라우저 DB에 영구 보관되며 신규 파일 업로드 시에도 유지됩니다.</p>
                  </div>
                  <button onClick={() => setIsMappingModalOpen(false)} title="창 닫기" className="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg btn-flex-center transition text-center justify-center">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                
                {rawData.length > 0 ? (
                  <div className="grid grid-cols-2 gap-4 mb-6">
                    {Object.entries({
                      dateCol: '거래일자', revenueCol: '매출액', productCol: '상품명', brandCol: '브랜드',
                      colorCol: '색상/컬러', sizeCol: '사이즈/규격', branchCol: '지점', channelCol: '판매채널', quantityCol: '판매수량'
                    }).map(([key, label]) => (
                      <div key={key}>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">{label} 필드</label>
                        <select value={mapping[key] || ''} onChange={e => setMapping({...mapping, [key]: e.target.value})} className="w-full p-2 text-xs border border-slate-300 rounded-md outline-none focus:border-blue-600">
                          <option value="">미지정</option>
                          {Object.keys(rawData[0]).map(col => <option key={col} value={col}>{col}</option>)}
                        </select>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="py-8 text-center text-xs text-slate-500">데이터가 없습니다. 파일을 업로드해 주세요.</div>
                )}
                
                <div className="flex gap-2">
                  <button onClick={() => autoDetectMapping(rawData[0], true)} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg text-xs text-center btn-flex-center justify-center">자동 재감지</button>
                  <button onClick={handleSaveMapping} className="flex-1 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg text-xs text-center btn-flex-center justify-center">매핑 적용 및 저장</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
