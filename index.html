<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Executive Business AI - 자율 다차원 데이터 탐색 시스템</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->

  <script>
    tailwind.config = {

            }

          }

      }
    }
  </script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    body {
      background-color: #f8fafc;

</head>
<body class="custom-scrollbar pb-20 md:pb-6">
  <div id="root"></div>

  <script type="text/babel">
    const DB_NAME = 'ExecAI_PersistentDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'session_store';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    };

    const saveToDB = async (key, data) => {
      try {
        const cleanData = JSON.parse(JSON.stringify(data));
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const req = store.put(cleanData, key);
          req.onsuccess = () => resolve(true);
          req.onerror = (e) => reject(e.target.error);
        });
      } catch (err) {
        console.error('IndexedDB Save Error:', err);
      }
    };

    const getFromDB = async (key) => {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = (e) => reject(e.target.error);
        });
      } catch (err) {
        console.error('IndexedDB Get Error:', err);
        return null;
      }
    };

    const removeFromDB = async (key) => {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const req = store.delete(key);
          req.onsuccess = () => resolve(true);
          req.onerror = (e) => reject(e.target.error);
        });
      } catch (err) {
        console.error('IndexedDB Delete Error:', err);
      }
    };

    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide && window.lucide.icons) {
          const camelName = name.replace(/-([a-z0-9])/g, (g) => g[1].toUpperCase());
          const pascalName = camelName.charAt(0).toUpperCase() + camelName.slice(1);
          const iconObj = window.lucide.icons[name] || window.lucide.icons[pascalName] || window.lucide.icons[camelName];

          iconRef.current.innerHTML = '';
          if (iconObj && window.lucide.createElement) {
            const iconElem = window.lucide.createElement(iconObj);
            if (iconElem) {
              iconElem.setAttribute('class', className);
              iconRef.current.appendChild(iconElem);
            }
          }
        }
      }, [name, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0 p-0 m-0 leading-none self-center"></span>;
    };

    const parseNumeric = (val) => {
      if (val === null || val === undefined) return 0;
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      const cleaned = String(val).replace(/,/g, '').replace(/원/g, '').trim();
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : num;
    };

    const parseDateToYearMonth = (rawVal, fallbackYear = '2026', fallbackMonth = 1) => {
      if (!rawVal) return { year: fallbackYear, month: fallbackMonth };
      if (rawVal instanceof Date && !isNaN(rawVal.getTime())) {
        return { year: String(rawVal.getFullYear()), month: rawVal.getMonth() + 1 };
      }
      if (typeof rawVal === 'number' && rawVal > 30000 && rawVal < 60000) {
        const jsDate = new Date((rawVal - (25567 + 2)) * 86400 * 1000);
        if (!isNaN(jsDate.getTime())) {
          return { year: String(jsDate.getFullYear()), month: jsDate.getMonth() + 1 };
        }
      }
      const str = String(rawVal).trim();
      const krMatch = str.match(/(?:20)?(\d{2})\s*년\s*(\d{1,2})\s*월/);
      if (krMatch) return { year: '20' + krMatch[1], month: parseInt(krMatch[2], 10) };
      const stdMatch = str.match(/(20\d{2})[-./\s](\d{1,2})/);
      if (stdMatch) return { year: stdMatch[1], month: parseInt(stdMatch[2], 10) };
      return { year: fallbackYear, month: fallbackMonth };
    };

    const formatRevenueDisplay = (rev) => {
      const num = parseNumeric(rev);
      if (num === 0) return '0원';
      const absNum = Math.abs(num);
      const prefix = num < 0 ? '-' : '';
      if (absNum >= 100000000) {
        return `${prefix}${(absNum / 100000000).toLocaleString(undefined, { maximumFractionDigits: 2 })}억원`;
      }
      if (absNum >= 1000000) {
        return `${prefix}${(absNum / 1000000).toLocaleString(undefined, { maximumFractionDigits: 1 })}백만원`;
      }
      if (absNum >= 10000) {
        return `${prefix}${(absNum / 10000).toLocaleString(undefined, { maximumFractionDigits: 0 })}만원`;
      }
      return `${prefix}${absNum.toLocaleString()}원`;
    };

    const classifyCategory = (productName) => {
      if (!productName) return '기타/미분류';
      const str = String(productName).toLowerCase();
      
      let genderPrefix = '';
      if (str.includes('여성') || str.includes('우먼') || str.includes('women')) genderPrefix = '여성 ';
      else if (str.includes('남성') || str.includes('맨') || str.includes('men')) genderPrefix = '남성 ';

      if (str.match(/티셔츠|반팔|긴팔|셔츠|블라우스|맨투맨|후드|니트|카디건|상의/)) return `${genderPrefix}의류/상의`.trim();
      if (str.match(/자켓|재킷|코트|점퍼|패딩|아우터|가디건|집업/)) return `${genderPrefix}의류/아우터`.trim();
      if (str.match(/반바지|긴바지|팬츠|청바지|슬랙스|치마|스커트|하의|레깅스/)) return `${genderPrefix}의류/하의`.trim();
      if (str.match(/가전|tv|티비|세탁기|냉장고|청소기|스크린|스타일러/)) return '가전';
      if (str.match(/스마트폰|노트북|모니터|마우스|키보드|헤드폰|it|macbook|ipad/)) return 'IT/디지털';
      if (str.match(/베개|베개커버|이불|침구|홈데코|커튼|패드|타월/)) return '침구/홈데코';
      if (str.match(/가방|모자|신발|운동화|잡화|양말|지갑|액세서리/)) return '패션잡화';

      return '일반/기타';
    };

    const inferSizeAgeSegment = (sizeStr, productName = '') => {
      if (!sizeStr) return { segment: '기본/Standard', fitType: '스탠다드' };
      const str = String(sizeStr).toUpperCase().trim();
      const prod = String(productName).toUpperCase();

      if (str.match(/85|90|XS|S/) || prod.match(/슬림|마른|아동|유아|키즈/)) {
        return { segment: '2030 영타깃/슬림핏', fitType: '슬림/타이트' };
      }
      if (str.match(/95|100|M|L/) || prod.match(/남여공용|FREE|스탠다드/)) {
        return { segment: '3040 성인 표준', fitType: '스탠다드' };
      }
      if (str.match(/105|110|XL|XXL|2XL|3XL/) || prod.match(/오버핏|빅사이즈|루즈/)) {
        return { segment: '4050/오버핏 트렌드', fitType: '오버핏/빅사이즈' };
      }
      if (str.match(/\d+X\d+/)) {
        return { segment: '침구/규격용', fitType: '홈데코 규격' };
      }
      return { segment: '기본/Standard', fitType: '스탠다드' };
    };

    const classifyColorPalette = (colorStr) => {
      if (!colorStr) return '기본/기타';
      const c = String(colorStr).toLowerCase();
      if (c.match(/크림|핑크|베이지|아이보리|파스텔|라벤더|민트|로즈/)) return '파스텔/크림 톤 (Soft Neutral)';
      if (c.match(/블랙|화이트|네이비|그레이|스페이스그레이|차콜/)) return '클래식 무채색 톤 (Monochrome)';
      if (c.match(/레드|블루|그린|옐로우|오렌지|퍼플/)) return '비비드 포인트 톤 (Vivid Accent)';
      return '기타/혼합 톤';
    };

    function App() {
      const [originalRawData, setOriginalRawData] = useState([]);
      const [rawData, setRawData] = useState([]);
      const [uploadedFileKeys, setUploadedFileKeys] = useState(new Set());
      const [activeTab, setActiveTab] = useState('DASHBOARD');
      const [toast, setToast] = useState(null);
      const [isRestoring, setIsRestoring] = useState(true);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const [mapping, setMapping] = useState({
        dateCol: '거래일자',
        revenueCol: '매출액',
        productCol: '상품명',
        brandCol: '브랜드',
        colorCol: '컬러',
        sizeCol: '사이즈',
        branchCol: '지점',
        channelCol: '판매채널',
        quantityCol: '수량'
      });

      const [apiKey, setApiKey] = useState('');

      useEffect(() => {
        let isMounted = true;
        const restoreSession = async () => {
          try {
            const savedKey = localStorage.getItem('EXEC_AI_API_KEY');
            const savedMap = localStorage.getItem('EXEC_AI_MAPPING');

            if (savedKey) setApiKey(savedKey);
            if (savedMap) setMapping(JSON.parse(savedMap));

            const savedRaw = await getFromDB('EXEC_AI_RAW_DATA');
            const savedOrig = await getFromDB('EXEC_AI_ORIG_DATA');
            const savedKeysArr = await getFromDB('EXEC_AI_FILE_KEYS');

            if (isMounted && savedRaw && Array.isArray(savedRaw) && savedRaw.length > 0) {
              setRawData(savedRaw);
              setOriginalRawData(savedOrig || savedRaw);
              if (savedKeysArr) setUploadedFileKeys(new Set(savedKeysArr));

              setTimeout(() => {
                showToast(`이전 데이터 세션 ${savedRaw.length.toLocaleString()}건 및 맞춤 매핑이 성공적으로 복원되었습니다.`);
              }, 400);
            }
          } catch (err) {
            console.error('Session restore error:', err);
          } finally {
            if (isMounted) setIsRestoring(false);
          }
        };

        restoreSession();
        return () => { isMounted = false; };
      }, []);

      useEffect(() => {
        if (isRestoring) return;
        const syncDB = async () => {
          try {
            if (rawData && rawData.length > 0) {
              await saveToDB('EXEC_AI_RAW_DATA', rawData);
              await saveToDB('EXEC_AI_ORIG_DATA', originalRawData);
              await saveToDB('EXEC_AI_FILE_KEYS', Array.from(uploadedFileKeys));
            }
          } catch (err) {
            console.warn('DB sync error:', err);
          }
        };
        syncDB();
      }, [rawData, originalRawData, uploadedFileKeys, isRestoring]);

      const [activeCleanings, setActiveCleanings] = useState({
        winsorizeAnomalies: false,
        removeNulls: false,
        fixZeroRevenues: false
      });

      const [isApiModalOpen, setIsApiModalOpen] = useState(false);
      const [isMappingModalOpen, setIsMappingModalOpen] = useState(false);
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { role: 'assistant', text: 'Executive AI Analyst 접속 완료. 업로드된 로우데이터 전체를 다각도로 정밀 분석하여 매출 구조, 카테고리/핏 트렌드, 단가/수량 매트릭스 및 경영 실행 전략을 지원해 드립니다.' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [savedChatInsights, setSavedChatInsights] = useState([]);
      const [isReportLoading, setIsReportLoading] = useState(false);
      const [isChatLoading, setIsChatLoading] = useState(false);
      const [aiReport, setAiReport] = useState(null);
      const [reportType, setReportType] = useState('executive');
      const [productSortBy, setProductSortBy] = useState('revenue');
      const [simParams, setSimParams] = useState({ price: 0, marketing: 10, demand: 5 });

      const autoDetectMapping = (sampleRow, force = false) => {
        if (!sampleRow) return;

        let currentMap = { ...mapping };
        if (!force) {
          try {
            const savedMap = localStorage.getItem('EXEC_AI_MAPPING');
            if (savedMap) currentMap = JSON.parse(savedMap);
          } catch (e) {}
        }

        const keys = Object.keys(sampleRow);
        const newMap = { ...currentMap };

        keys.forEach(k => {
          const lower = k.toLowerCase();
          if (force || !newMap.dateCol) {
            if (lower.includes('일자') || lower.includes('날짜') || lower.includes('date')) newMap.dateCol = k;
          }
          if (force || !newMap.revenueCol) {
            if (lower.includes('매출') || lower.includes('금액') || lower.includes('revenue')) newMap.revenueCol = k;
          }
          if (force || !newMap.productCol) {
            if (lower.includes('상품') || lower.includes('제품') || lower.includes('item')) newMap.productCol = k;
          }
          if (force || !newMap.brandCol) {
            if (lower.includes('브랜드') || lower.includes('brand')) newMap.brandCol = k;
          }
          if (force || !newMap.branchCol) {
            if (lower.includes('지점') || lower.includes('점포') || lower.includes('매장')) newMap.branchCol = k;
          }
          if (force || !newMap.channelCol) {
            if (lower.includes('채널') || lower.includes('channel')) newMap.channelCol = k;
          }
          if (force || !newMap.quantityCol) {
            if (lower.includes('수량') || lower.includes('qty')) newMap.quantityCol = k;
          }
          if (force || !newMap.colorCol) {
            if (lower.includes('컬러') || lower.includes('색상')) newMap.colorCol = k;
          }
          if (force || !newMap.sizeCol) {
            if (lower.includes('사이즈') || lower.includes('규격')) newMap.sizeCol = k;
          }
        });
        setMapping(newMap);
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        if (!files || files.length === 0) return;

        let newlyParsedData = [];
        let filesProcessed = 0;
        let duplicateCount = 0;
        const currentKeys = new Set(uploadedFileKeys);
        const addedKeysThisBatch = [];

        const processUploadResults = () => {
          if (addedKeysThisBatch.length > 0) {
            addedKeysThisBatch.forEach(k => currentKeys.add(k));
            setUploadedFileKeys(currentKeys);
            setOriginalRawData(prev => [...prev, ...newlyParsedData]);
            setRawData(prev => [...prev, ...newlyParsedData]);
            setActiveCleanings({ winsorizeAnomalies: false, removeNulls: false, fixZeroRevenues: false });
            autoDetectMapping(newlyParsedData[0], false);

            let msg = `신규 파일 ${addedKeysThisBatch.length}개 (${newlyParsedData.length.toLocaleString()}건) 데이터가 반영되었습니다.`;
            if (duplicateCount > 0) msg += ` (중복 파일 ${duplicateCount}개 제외)`;
            showToast(msg);
          } else if (duplicateCount > 0) {
            showToast(`이미 업로드된 중복 파일입니다.`, 'error');
          }
        };

        files.forEach((file) => {
          const fileKey = `${file.name}_${file.size}_${file.lastModified}`;
          if (currentKeys.has(fileKey)) {
            duplicateCount++;
            filesProcessed++;
            if (filesProcessed === files.length) processUploadResults();
            return;
          }

          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const bstr = evt.target.result;
              const wb = XLSX.read(bstr, { type: 'binary' });
              wb.SheetNames.forEach((sheetName) => {
                const sheetData = XLSX.utils.sheet_to_json(wb.Sheets[sheetName]);
                if (sheetData && sheetData.length > 0) {
                  newlyParsedData = newlyParsedData.concat(sheetData);
                }
              });
              addedKeysThisBatch.push(fileKey);
            } catch (err) {
              console.error(`File read error (${file.name}):`, err);
            } finally {
              filesProcessed++;
              if (filesProcessed === files.length) processUploadResults();
            }
          };
          reader.readAsBinaryString(file);
        });
        e.target.value = '';
      };

      const handleResetData = async () => {
        setOriginalRawData([]);
        setRawData([]);
        setUploadedFileKeys(new Set());
        setAiReport(null);
        setActiveCleanings({ winsorizeAnomalies: false, removeNulls: false, fixZeroRevenues: false });
        await removeFromDB('EXEC_AI_RAW_DATA');
        await removeFromDB('EXEC_AI_ORIG_DATA');
        await removeFromDB('EXEC_AI_FILE_KEYS');
        showToast('저장된 데이터가 완전히 초기화되었습니다.');
      };

      const analytics = useMemo(() => {
        if (!rawData || rawData.length === 0) return null;

        const keys = Object.keys(rawData[0]);
        let costKey = keys.find(k => k.match(/원가|매입가|cost/i));
        let profitKey = keys.find(k => k.match(/영업이익|순이익|profit/i));

        let totalRevenue = 0;
        let totalGrossRevenue = 0;
        let totalProfit = 0;
        let totalCost = 0;
        let totalQtySum = 0;
        let refundCount = 0;
        let refundTotalAmount = 0;
        let refundTotalQty = 0;
        let calculationMethod = '';
        let hasProfitOrCostData = false;
        let rowAnomalyCount = 0;

        const yearlyMap = {};
        const monthlyMap = {};
        const timelineMap = {};
        const productMap = {};
        const categoryMap = {};
        const brandMap = {};
        const branchMap = {};
        const channelMap = {};
        const colorMap = {};
        const colorPaletteMap = {};
        const sizeMap = {};
        const sizeSegmentMap = {};
        const keywordMap = {};
        const priceTierMap = { '초저가(1만원 미만)': 0, '대중형(1~5만원)': 0, '중고가(5~20만원)': 0, '프리미엄(20만원 이상)': 0 };

        let missingValues = 0;
        let totalMappedCells = 0;
        const activeMappingCols = Object.values(mapping).filter(col => col && String(col).trim() !== '');

        rawData.forEach(row => {
          activeMappingCols.forEach(colKey => {
            totalMappedCells++;
            const val = row[colKey];
            if (val === null || val === undefined || String(val).trim() === '' || String(val) === '-' || String(val).toLowerCase() === 'null') {
              missingValues++;
            }
          });

          const rev = parseNumeric(row[mapping.revenueCol]);
          const qty = parseNumeric(row[mapping.quantityCol]) || 1;
          const absQty = Math.abs(qty);
          const unitPrice = absQty > 0 ? Math.abs(rev / absQty) : 0;

          if (absQty > 100000 || (Math.abs(rev) > 10000 && unitPrice < 5 && absQty > 1000)) {
            rowAnomalyCount++;
          }

          let cost = 0;
          let profit = 0;

          if (rev < 0 || qty < 0) {
            refundCount++;
            refundTotalAmount += Math.abs(rev);
            refundTotalQty += Math.abs(qty);
          } else {
            totalGrossRevenue += rev;
          }

          if (profitKey && row[profitKey] !== undefined && row[profitKey] !== null) {
            profit = parseNumeric(row[profitKey]);
            cost = costKey && row[costKey] !== undefined ? parseNumeric(row[costKey]) : rev - profit;
            calculationMethod = '원본 데이터 [영업이익] 필드 직접 합산';
            hasProfitOrCostData = true;
          } else if (costKey && row[costKey] !== undefined && row[costKey] !== null) {
            cost = parseNumeric(row[costKey]);
            profit = rev - cost;
            calculationMethod = '매출액 - 원본 데이터 [원가] 차감 산출';
            hasProfitOrCostData = true;
          } else {
            profit = 0;
            cost = 0;
            calculationMethod = '원가/이익 필드 미비로 건당 평균 매출액(AOV) 및 평균 단가(ASP) 지표 제공';
            hasProfitOrCostData = false;
          }

          totalRevenue += rev;
          totalProfit += profit;
          totalCost += cost;
          totalQtySum += qty;

          const { year, month } = parseDateToYearMonth(row[mapping.dateCol]);
          const ym = `${year}-${String(month).padStart(2, '0')}`;

          yearlyMap[year] = (yearlyMap[year] || 0) + rev;
          monthlyMap[month] = (monthlyMap[month] || 0) + rev;
          timelineMap[ym] = (timelineMap[ym] || 0) + rev;

          // Price Tier Distribution
          if (unitPrice < 10000) priceTierMap['초저가(1만원 미만)'] += rev;
          else if (unitPrice < 50000) priceTierMap['대중형(1~5만원)'] += rev;
          else if (unitPrice < 200000) priceTierMap['중고가(5~20만원)'] += rev;
          else priceTierMap['프리미엄(20만원 이상)'] += rev;

          const prod = row[mapping.productCol] ? String(row[mapping.productCol]).trim() : null;
          const brand = row[mapping.brandCol] ? String(row[mapping.brandCol]).trim() : null;
          const branch = row[mapping.branchCol] ? String(row[mapping.branchCol]).trim() : null;
          const channel = row[mapping.channelCol] ? String(row[mapping.channelCol]).trim() : null;
          const color = row[mapping.colorCol] ? String(row[mapping.colorCol]).trim() : null;
          const size = row[mapping.sizeCol] ? String(row[mapping.sizeCol]).trim() : null;

          if (prod) {
            const cat = classifyCategory(prod);
            if (!categoryMap[cat]) categoryMap[cat] = { revenue: 0, qty: 0, count: 0 };
            categoryMap[cat].revenue += rev;
            categoryMap[cat].qty += qty;
            categoryMap[cat].count += 1;

            if (!productMap[prod]) {
              productMap[prod] = { 
                revenue: 0, grossRevenue: 0, qty: 0, grossQty: 0, 
                refundQty: 0, refundAmount: 0, refundTxCount: 0, 
                profit: 0, brand: brand || '-', category: cat 
              };
            }
            productMap[prod].revenue += rev;
            productMap[prod].qty += qty;
            productMap[prod].profit += profit;

            if (rev < 0 || qty < 0) {
              productMap[prod].refundQty += Math.abs(qty);
              productMap[prod].refundAmount += Math.abs(rev);
              productMap[prod].refundTxCount += 1;
            } else {
              productMap[prod].grossRevenue += rev;
              productMap[prod].grossQty += qty;
            }

            // Keyword Extraction
            const words = prod.split(/\s+/);
            words.forEach(w => {
              const cleanW = w.replace(/[^가-힣a-zA-Z0-9]/g, '');
              if (cleanW.length >= 2 && !['상세', '상품', '추가', '옵션', '세트'].includes(cleanW)) {
                if (!keywordMap[cleanW]) keywordMap[cleanW] = { count: 0, revenue: 0 };
                keywordMap[cleanW].count += 1;
                keywordMap[cleanW].revenue += rev;
              }
            });
          }

          if (branch) {
            if (!branchMap[branch]) branchMap[branch] = { revenue: 0, refundAmount: 0, refundCount: 0, totalCount: 0 };
            branchMap[branch].revenue += rev;
            branchMap[branch].totalCount += 1;
            if (rev < 0 || qty < 0) {
              branchMap[branch].refundAmount += Math.abs(rev);
              branchMap[branch].refundCount += 1;
            }
          }

          if (channel) {
            if (!channelMap[channel]) channelMap[channel] = { revenue: 0, refundAmount: 0, refundCount: 0, totalCount: 0 };
            channelMap[channel].revenue += rev;
            channelMap[channel].totalCount += 1;
            if (rev < 0 || qty < 0) {
              channelMap[channel].refundAmount += Math.abs(rev);
              channelMap[channel].refundCount += 1;
            }
          }

          if (brand) brandMap[brand] = (brandMap[brand] || 0) + rev;

          if (color) {
            colorMap[color] = (colorMap[color] || 0) + Math.abs(qty);
            const palette = classifyColorPalette(color);
            if (!colorPaletteMap[palette]) colorPaletteMap[palette] = { qty: 0, revenue: 0 };
            colorPaletteMap[palette].qty += Math.abs(qty);
            colorPaletteMap[palette].revenue += rev;
          }

          if (size) {
            sizeMap[size] = (sizeMap[size] || 0) + Math.abs(qty);
            const segObj = inferSizeAgeSegment(size, prod || '');
            if (!sizeSegmentMap[segObj.segment]) sizeSegmentMap[segObj.segment] = { qty: 0, revenue: 0, fitType: segObj.fitType };
            sizeSegmentMap[segObj.segment].qty += Math.abs(qty);
            sizeSegmentMap[segObj.segment].revenue += rev;
          }
        });

        const sortedYears = Object.keys(yearlyMap).sort();
        const latestYear = sortedYears[sortedYears.length - 1];
        const prevYear = sortedYears[sortedYears.length - 2];
        let yoyGrowth = null;
        let yoyText = "단일 연도 데이터";

        if (prevYear && yearlyMap[prevYear] > 0) {
          yoyGrowth = ((yearlyMap[latestYear] - yearlyMap[prevYear]) / yearlyMap[prevYear]) * 100;
          yoyText = `YoY ${yoyGrowth > 0 ? '+' : ''}${yoyGrowth.toFixed(1)}% (${prevYear} 대비)`;
        }

        const sortedProducts = Object.entries(productMap)
          .map(([name, data]) => {
            const asp = data.qty > 0 ? Math.round(data.revenue / data.qty) : 0;
            return { name, ...data, asp };
          })
          .sort((a, b) => b.revenue - a.revenue);

        const avgQtyThreshold = totalQtySum / Math.max(1, sortedProducts.length);
        const overallASP = totalQtySum > 0 ? totalRevenue / totalQtySum : 0;

        let cumRev = 0;
        const productsABC = sortedProducts.map(p => {
          cumRev += p.revenue;
          const share = totalRevenue > 0 ? (p.revenue / totalRevenue) * 100 : 0;
          const cumShare = totalRevenue > 0 ? (cumRev / totalRevenue) * 100 : 0;
          let abc = 'C';
          if (cumShare <= 70) abc = 'A';
          else if (cumShare <= 90) abc = 'B';

          let roleTag = '일반';
          if (p.qty >= avgQtyThreshold * 1.5 && p.asp >= overallASP * 1.2) roleTag = '핵심 스타';
          else if (p.qty >= avgQtyThreshold * 1.5) roleTag = '볼륨 주력';
          else if (p.asp >= overallASP * 1.5 && p.revenue > 0) roleTag = '고단가 주력';

          return { ...p, share, abc, roleTag };
        });

        const sortedCategories = Object.entries(categoryMap)
          .map(([name, data]) => ({
            name,
            revenue: data.revenue,
            qty: data.qty,
            share: totalRevenue > 0 ? (data.revenue / totalRevenue) * 100 : 0,
            asp: data.qty > 0 ? Math.round(data.revenue / data.qty) : 0
          }))
          .sort((a, b) => b.revenue - a.revenue);

        const sortedColorPalettes = Object.entries(colorPaletteMap)
          .map(([palette, data]) => ({ palette, qty: data.qty, revenue: data.revenue }))
          .sort((a, b) => b.qty - a.qty);

        const sortedSizeSegments = Object.entries(sizeSegmentMap)
          .map(([segment, data]) => ({ segment, qty: data.qty, revenue: data.revenue, fitType: data.fitType }))
          .sort((a, b) => b.qty - a.qty);

        const topVolumeProducts = [...productsABC].sort((a, b) => b.qty - a.qty).slice(0, 5);
        const topHighASPProducts = [...productsABC].filter(p => p.qty > 0).sort((a, b) => b.asp - a.asp).slice(0, 5);

        const topRefundedProducts = Object.entries(productMap)
          .map(([name, data]) => ({
            name,
            brand: data.brand,
            category: data.category,
            refundAmount: data.refundAmount,
            refundQty: data.refundQty,
            refundRate: data.grossRevenue > 0 ? (data.refundAmount / data.grossRevenue) * 100 : 0
          }))
          .filter(p => p.refundAmount > 0)
          .sort((a, b) => b.refundAmount - a.refundAmount)
          .slice(0, 5);

        const topKeywords = Object.entries(keywordMap)
          .sort((a, b) => b[1].revenue - a[1].revenue)
          .slice(0, 10)
          .map(([kw, data]) => ({ keyword: kw, count: data.count, revenue: data.revenue }));

        const totalSKUCount = productsABC.length;
        const top20SKUCount = Math.max(1, Math.ceil(productsABC.length * 0.2));
        const top20Revenue = productsABC.slice(0, top20SKUCount).reduce((sum, p) => sum + p.revenue, 0);
        const top20Share = totalRevenue > 0 ? (top20Revenue / totalRevenue) * 100 : 0;

        const getTop = (map, limit = 5) => Object.entries(map).sort((a, b) => (b[1].revenue || b[1]) - (a[1].revenue || a[1])).slice(0, limit);

        const avgOrderValue = rawData.length > 0 ? Math.round(totalRevenue / rawData.length) : 0;
        const avgSellingPrice = totalQtySum > 0 ? Math.round(totalRevenue / totalQtySum) : 0;
        const basketSize = rawData.length > 0 ? (totalQtySum / rawData.length).toFixed(1) : '1.0';

        return {
          totalRevenue,
          totalGrossRevenue,
          totalProfit,
          hasProfitOrCostData,
          avgOrderValue,
          avgSellingPrice,
          basketSize,
          profitMargin: totalRevenue > 0 ? (totalProfit / totalRevenue) * 100 : 0,
          refundCount,
          refundTotalAmount,
          refundTotalQty,
          refundRate: totalGrossRevenue > 0 ? (refundTotalAmount / totalGrossRevenue) * 100 : 0,
          calculationMethod,
          yoyGrowth,
          yoyText,
          sortedYears,
          yearlyMap,
          monthlyMap,
          priceTierMap,
          productsABC,
          sortedCategories,
          sortedColorPalettes,
          sortedSizeSegments,
          topVolumeProducts,
          topHighASPProducts,
          totalSKUCount,
          top20SKUCount,
          top20Share,
          topRefundedProducts,
          topKeywords,
          topBrands: getTop(brandMap, 5).map(([k, v]) => [k, v]),
          topBranches: getTop(branchMap, 5).map(([k, v]) => [k, v.revenue || v]),
          topChannels: getTop(channelMap, 5).map(([k, v]) => [k, v.revenue || v]),
          rowCount: rawData.length,
          missingValues,
          totalMappedCells,
          reliabilityScore: Math.max(0, Math.min(100, Math.round(100 - ((missingValues / Math.max(1, totalMappedCells)) * 100))))
        };
      }, [rawData, mapping]);

      const applyDataCleaning = (type) => {
        let cleaned = [...rawData];
        if (type === 'winsorizeAnomalies') {
          const productASPMap = {};
          cleaned.forEach(row => {
            const p = row[mapping.productCol];
            const r = parseNumeric(row[mapping.revenueCol]);
            const q = parseNumeric(row[mapping.quantityCol]);
            if (p && r > 0 && q > 0 && q < 100000) {
              if (!productASPMap[p]) productASPMap[p] = { totalR: 0, totalQ: 0 };
              productASPMap[p].totalR += r;
              productASPMap[p].totalQ += q;
            }
          });

          let fixedRowCount = 0;
          cleaned = cleaned.map(row => {
            const rev = parseNumeric(row[mapping.revenueCol]);
            const qty = parseNumeric(row[mapping.quantityCol]);
            const absQty = Math.abs(qty);
            const unitPrice = absQty > 0 ? Math.abs(rev / absQty) : 0;

            if (absQty > 100000 || (Math.abs(rev) > 5000 && unitPrice < 5 && absQty > 100)) {
              fixedRowCount++;
              const p = row[mapping.productCol];
              const pStats = productASPMap[p];
              const avgASP = (pStats && pStats.totalQ > 0) ? (pStats.totalR / pStats.totalQ) : 30000;
              const correctedQty = (rev !== 0 && avgASP > 0) ? Math.max(1, Math.round(Math.abs(rev) / avgASP)) * (qty < 0 ? -1 : 1) : 1;
              return { ...row, [mapping.quantityCol]: correctedQty };
            }
            return row;
          });

          setActiveCleanings(prev => ({ ...prev, winsorizeAnomalies: true }));
          showToast(`이상치 보정 적용 완료 (${fixedRowCount}건 보정됨)`);
        } else if (type === 'removeNulls') {
          const activeCols = Object.values(mapping).filter(col => col && String(col).trim() !== '');
          cleaned = cleaned.filter(row => {
            return activeCols.every(colKey => {
              const val = row[colKey];
              if (val === null || val === undefined) return false;
              const str = String(val).trim().toLowerCase();
              return str !== '' && str !== '-' && str !== 'null' && str !== 'undefined';
            });
          });
          setActiveCleanings(prev => ({ ...prev, removeNulls: true }));
          showToast('결측치 정제가 적용되어 신뢰도 100점이 되었습니다.');
        } else if (type === 'fixZeroRevenues') {
          let totalValidRev = 0;
          let totalValidQty = 0;
          cleaned.forEach(row => {
            const r = parseNumeric(row[mapping.revenueCol]);
            const q = Math.abs(parseNumeric(row[mapping.quantityCol]));
            if (r > 0 && q > 0) {
              totalValidRev += r;
              totalValidQty += q;
            }
          });
          const avgUnitPrice = totalValidQty > 0 ? Math.round(totalValidRev / totalValidQty) : 30000;

          cleaned = cleaned.map(row => {
            const rev = parseNumeric(row[mapping.revenueCol]);
            const qty = parseNumeric(row[mapping.quantityCol]) || 1;
            if (rev === 0) {
              return { ...row, [mapping.revenueCol]: avgUnitPrice * Math.abs(qty), [mapping.quantityCol]: Math.abs(qty) };
            }
            return row;
          });
          setActiveCleanings(prev => ({ ...prev, fixZeroRevenues: true }));
          showToast('0원 미입력 매출 보정이 적용되었습니다.');
        } else if (type === 'reset') {
          cleaned = [...originalRawData];
          setActiveCleanings({ winsorizeAnomalies: false, removeNulls: false, fixZeroRevenues: false });
          showToast('원본 데이터로 복원되었습니다.');
        }

        setRawData(cleaned);
      };

                      <h3 className="text-base font-bold text-slate-900">AI 경영 전략 보고서</h3>
                      <button onClick={handleGenerateReport} disabled={isReportLoading} className="pl-3.5 pr-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-md btn-flex-center gap-1.5 transition">
                        {isReportLoading ? <Icon name="loader-2" className="w-3.5 h-3.5 animate-spin" /> : <Icon name="refresh-cw" className="w-3.5 h-3.5" />}
                        <span>리포트 생성하기</span>
                      </button>
                    </div>

                    <div className="flex-1 text-xs text-slate-800 leading-relaxed whitespace-pre-line bg-slate-50 p-6 rounded-lg border border-slate-100 overflow-y-auto custom-scrollbar">
                      {isReportLoading ? (
                        <div className="h-full min-h-[300px] flex flex-col items-center justify-center text-slate-400">
                          <Icon name="cpu" className="w-8 h-8 mb-3 animate-pulse" />
                          <p>AI 애널리스트가 업로드된 로우데이터의 가격대, 수량 vs ASP, 연령/핏 세그먼트, 텍스트 마이닝 결과를 다각도로 분석 중입니다...</p>
                        </div>
                      ) : aiReport ? (
                        <div>{aiReport}</div>
                      ) : (
                        <div className="h-full min-h-[300px] flex flex-col items-center justify-center text-slate-400 text-center">
                          <p>상단 '리포트 생성하기' 버튼을 누르면 전체 데이터가 교차 반영된 AI 분석보고서가 작성됩니다.</p>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* SANITY TAB */}
                {activeTab === 'SANITY' && analytics && (
                  <div className="space-y-6">
                    <div className="exec-card p-6">
                      <h3 className="text-sm font-bold text-slate-900 mb-4">데이터 무결성 검증 및 보정</h3>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <button onClick={() => applyDataCleaning('winsorizeAnomalies')} className="p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-lg text-left transition">
                          <div className="font-bold text-xs text-slate-900 mb-1">이상치/바코드 오입력 보정</div>
                          <div className="text-[11px] text-slate-500">수량 오입력 레코드를 정상 단가 기준 수량으로 자동 대치합니다.</div>
                        </button>
                        <button onClick={() => applyDataCleaning('removeNulls')} className="p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-lg text-left transition">
                          <div className="font-bold text-xs text-slate-900 mb-1">결측치 자동 정제 (100점 만들기)</div>
                          <div className="text-[11px] text-slate-500">공백/무효한 필드를 정제하여 100점 무결성을 달성합니다.</div>
                        </button>
                        <button onClick={() => applyDataCleaning('fixZeroRevenues')} className="p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-lg text-left transition">
                          <div className="font-bold text-xs text-slate-900 mb-1">0원 매출액 보정</div>
                          <div className="text-[11px] text-slate-500">누락된 0원 매출을 평균 단가 매출액으로 자동 보정합니다.</div>
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}
          </main>

          {/* AI Chatbot Drawer */}
          {rawData.length > 0 && (
            <div className="fixed bottom-6 right-6 z-40">
              {isChatOpen ? (
                <div className="w-80 md:w-96 h-[520px] bg-white rounded-xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
                  <div className="px-4 py-3 bg-slate-900 text-white flex justify-between items-center shrink-0">
                    <div className="flex items-center gap-2">
                      <Icon name="bot" className="w-4 h-4 text-blue-400" />
                      <span className="font-bold text-xs">AI 경영 컨설턴트 (다차원 분석)</span>
                    </div>
                    <button onClick={() => setIsChatOpen(false)} className="p-1 text-slate-400 hover:text-white">✕</button>
                  </div>
                  
                  <div className="flex-1 p-4 overflow-y-auto bg-slate-50 space-y-3 custom-scrollbar text-xs">
                    {chatMessages.map((msg, i) => (
                      <div key={i} className={`flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'}`}>
                        <div className={`p-3 rounded-lg max-w-[88%] leading-relaxed ${msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 text-slate-800 shadow-sm'}`}>
                          {msg.text}
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="p-3 bg-white border-t border-slate-200 flex gap-2">
                    <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleChatSubmit()} placeholder="다차원 분석 질문 (예: 가격대별 전략, 카테고리 기여도)..." className="flex-1 px-3 py-2 bg-slate-100 rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-600" />
                    <button onClick={handleChatSubmit} disabled={isChatLoading} className="p-2.5 bg-slate-900 text-white rounded-lg btn-flex-center">
                      {isChatLoading ? <Icon name="loader-2" className="w-3.5 h-3.5 animate-spin" /> : <Icon name="send" className="w-3.5 h-3.5" />}
                    </button>
                  </div>
                </div>
              ) : (
                <button onClick={() => setIsChatOpen(true)} className="pl-3.5 pr-4 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-full shadow-xl font-bold text-xs btn-flex-center gap-2">
                  <Icon name="message-square" className="w-4 h-4 text-blue-400" />
                  <span>AI 경영 컨설턴트</span>
                </button>
              )}
            </div>
          )}

          {/* Modals */}
          {isApiModalOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
                <h3 className="font-bold text-slate-900 text-sm mb-3">Gemini API 키 설정</h3>
                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="AIzaSy..." className="w-full p-2.5 text-xs border border-slate-300 rounded-lg mb-4 outline-none focus:border-blue-600" />
                <button onClick={() => { localStorage.setItem('EXEC_AI_API_KEY', apiKey); setIsApiModalOpen(false); showToast('API 키가 저장되었습니다.'); }} className="w-full py-2.5 bg-slate-900 text-white font-bold rounded-lg text-xs">저장하기</button>
              </div>
            </div>
          )}

          {isMappingModalOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl p-6 w-full max-w-lg shadow-2xl">
                <h3 className="font-bold text-slate-900 text-sm mb-4">필드 매핑 설정</h3>
                <div className="grid grid-cols-2 gap-4 mb-6">
                  {Object.entries({ dateCol: '거래일자', revenueCol: '매출액', productCol: '상품명', brandCol: '브랜드', colorCol: '컬러', sizeCol: '사이즈', branchCol: '지점', channelCol: '판매채널', quantityCol: '수량' }).map(([key, label]) => (
                    <div key={key}>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">{label}</label>
                      <select value={mapping[key] || ''} onChange={e => setMapping({ ...mapping, [key]: e.target.value })} className="w-full p-2 text-xs border border-slate-300 rounded-md">
                        <option value="">미지정</option>
                        {rawData[0] && Object.keys(rawData[0]).map(col => <option key={col} value={col}>{col}</option>)}
                      </select>
                    </div>
                  ))}
                </div>
                <button onClick={() => setIsMappingModalOpen(false)} className="w-full py-2.5 bg-slate-900 text-white font-bold rounded-lg text-xs">저장 및 매핑 적용</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
