<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Executive Business AI - 경영 대시보드</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS (Excel Parsing) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans pb-20 md:pb-6">
  <div id="root"></div>

  <script type="text/babel">
    const DB_NAME = 'ExecAI_DB';
    const DB_VERSION = 1;
    const STORE_NAME = 'app_session';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    };

    const saveToDB = async (key, value) => {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const safeValue = JSON.parse(JSON.stringify(value));
        store.put(safeValue, key);
        return tx.complete;
      } catch (err) {
        console.error('IndexedDB Save Error:', err);
      }
    };

    const loadFromDB = async (key) => {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        return new Promise((resolve) => {
          const request = store.get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => resolve(null);
        });
      } catch (err) {
        console.error('IndexedDB Load Error:', err);
        return null;
      }
    };

    const removeFromDB = async (key) => {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(key);
      } catch (err) {
        console.error('IndexedDB Delete Error:', err);
      }
    };

    const App = () => {
      const [rawData, setRawData] = React.useState([]);
      const [mappedFields, setMappedFields] = React.useState({
        date: '',
        sales: '',
        product: '',
        branch: '',
        channel: '',
        brand: '',
        qty: ''
      });
      const [apiKey, setApiKey] = React.useState(localStorage.getItem('exec_gemini_api_key') || '');
      const [isRestoring, setIsRestoring] = React.useState(true);
      const [activeTab, setActiveTab] = React.useState('dashboard');
      const [toastMessage, setToastMessage] = React.useState(null);
      
      // Modals and Drawers
      const [showKeyModal, setShowKeyModal] = React.useState(false);
      const [showMappingModal, setShowMappingModal] = React.useState(false);
      const [showResetModal, setShowResetModal] = React.useState(false);
      const [showChatDrawer, setShowChatDrawer] = React.useState(false);

      // AI States
      const [aiReport, setAiReport] = React.useState('');
      const [isReportLoading, setIsReportLoading] = React.useState(false);
      const [chatMessages, setChatMessages] = React.useState([
        { role: 'assistant', text: '안녕하세요! 비즈니스 데이터 기반 1:1 AI 컨설턴트입니다. 매출, 인기 상품, 채널 분석 등 무엇이든 물어보세요.' }
      ]);
      const [chatInput, setChatInput] = React.useState('');
      const [isChatLoading, setIsChatLoading] = React.useState(false);

      // Filter States
      const [searchQuery, setSearchQuery] = React.useState('');
      const [selectedBranch, setSelectedBranch] = React.useState('ALL');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      React.useEffect(() => {
        const restoreSession = async () => {
          try {
            const savedData = await loadFromDB('saved_raw_data');
            const savedMapping = await loadFromDB('saved_mapped_fields');
            if (savedData && Array.isArray(savedData) && savedData.length > 0) {
              setRawData(savedData);
              if (savedMapping) setMappedFields(savedMapping);
              showToast(`저장된 데이터 ${savedData.length.toLocaleString()}건 및 설정이 자동 복원되었습니다.`);
            }
          } catch (e) {
            console.error('Session Restore Fail:', e);
          } finally {
            setIsRestoring(false);
          }
        };
        restoreSession();
      }, []);

      React.useEffect(() => {
        if (isRestoring) return;
        if (rawData.length > 0) {
          saveToDB('saved_raw_data', rawData);
          saveToDB('saved_mapped_fields', mappedFields);
        } else {
          removeFromDB('saved_raw_data');
          removeFromDB('saved_mapped_fields');
        }
      }, [rawData, mappedFields, isRestoring]);

      const handleFileUpload = (e, isAppending = false) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary', cellDates: true });
            const wsname = wb.SheetNames[0];
            const ws = wb.Sheets[wsname];
            const data = XLSX.utils.sheet_to_json(ws, { defval: '' });

            if (data.length === 0) {
              showToast('업로드된 파일에 분석 데이터가 없습니다.');
              return;
            }

            const headers = Object.keys(data[0]);
            const autoMapping = { ...mappedFields };

            headers.forEach(h => {
              const lower = h.toLowerCase();
              if (!autoMapping.date && (lower.includes('일자') || lower.includes('날짜') || lower.includes('date'))) autoMapping.date = h;
              if (!autoMapping.sales && (lower.includes('매출') || lower.includes('금액') || lower.includes('amount') || lower.includes('price'))) autoMapping.sales = h;
              if (!autoMapping.product && (lower.includes('상품') || lower.includes('품목') || lower.includes('item') || lower.includes('product'))) autoMapping.product = h;
              if (!autoMapping.branch && (lower.includes('지점') || lower.includes('매장') || lower.includes('branch') || lower.includes('store'))) autoMapping.branch = h;
              if (!autoMapping.channel && (lower.includes('채널') || lower.includes('구분') || lower.includes('channel'))) autoMapping.channel = h;
              if (!autoMapping.brand && (lower.includes('브랜드') || lower.includes('brand'))) autoMapping.brand = h;
              if (!autoMapping.qty && (lower.includes('수량') || lower.includes('qty') || lower.includes('quantity'))) autoMapping.qty = h;
            });

            if (isAppending && rawData.length > 0) {
              const combined = [...rawData, ...data];
              setRawData(combined);
              showToast(`기존 데이터에 ${data.length.toLocaleString()}건이 추가되어 총 ${combined.length.toLocaleString()}건이 되었습니다.`);
            } else {
              setRawData(data);
              setMappedFields(autoMapping);
              showToast(`${data.length.toLocaleString()}건의 데이터 업로드가 완료되었습니다.`);
            }
          } catch (err) {
            console.error(err);
            showToast('파일을 읽는 중 오류가 발생했습니다.');
          }
          e.target.value = '';
        };
        reader.readAsBinaryString(file);
      };

      const loadSampleData = () => {
        const sample = [
          { 날짜: '2026-07-01', 매출액: 2450000, 상품명: '프리미엄 AI 노트북', 지점: '강남본점', 채널: '온라인몰', 브랜드: 'TechExec', 수량: 2 },
          { 날짜: '2026-07-02', 매출액: 1200000, 상품명: '무선 노이즈캔슬링 헤드폰', 지점: '홍대점', 채널: '직영매장', 브랜드: 'SoundMaster', 수량: 4 },
          { 날짜: '2026-07-03', 매출액: -150000, 상품명: '스마트 워치 밴드 (반품)', 지점: '강남본점', 채널: '온라인몰', 브랜드: 'TechExec', 수량: -1 },
          { 날짜: '2026-07-04', 매출액: 3800000, 상품명: '울트라 세로형 모니터 32인치', 지점: '판교점', 채널: 'B2B납품', 브랜드: 'TechExec', 수량: 5 },
          { 날짜: '2026-07-05', 매출액: 980000, 상품명: '인간공학 버티컬 마우스', 지점: '부산점', 채널: '온라인몰', 브랜드: 'OfficeGear', 수량: 10 },
          { 날짜: '2026-07-06', 매출액: 4500000, 상품명: '프리미엄 AI 노트북', 지점: '강남본점', 채널: 'B2B납품', 브랜드: 'TechExec', 수량: 4 },
          { 날짜: '2026-07-07', 매출액: 1600000, 상품명: '기계식 게이밍 키보드', 지점: '홍대점', 채널: '온라인몰', 브랜드: 'OfficeGear', 수량: 8 },
          { 날짜: '2026-07-08', 매출액: 2100000, 상품명: '무선 노이즈캔슬링 헤드폰', 지점: '판교점', 채널: '직영매장', 브랜드: 'SoundMaster', 수량: 7 }
        ];
        const mapping = { date: '날짜', sales: '매출액', product: '상품명', branch: '지점', channel: '채널', brand: '브랜드', qty: '수량' };
        setRawData(sample);
        setMappedFields(mapping);
        showToast('데모 데이터(8건)가 성공적으로 로드되었습니다.');
      };

      const executeResetData = () => {
        setRawData([]);
        setMappedFields({ date: '', sales: '', product: '', branch: '', channel: '', brand: '', qty: '' });
        removeFromDB('saved_raw_data');
        removeFromDB('saved_mapped_fields');
        setShowResetModal(false);
        showToast('데이터 세션이 안전하게 초기화되었습니다.');
      };

      const saveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('exec_gemini_api_key', key);
        setShowKeyModal(false);
        showToast(key ? 'Gemini API 키가 저장되었습니다.' : 'API 키가 삭제되었습니다.');
      };

      const filteredData = React.useMemo(() => {
        return rawData.filter(item => {
          const matchBranch = selectedBranch === 'ALL' || String(item[mappedFields.branch]) === selectedBranch;
          const matchSearch = !searchQuery || Object.values(item).some(val => String(val).toLowerCase().includes(searchQuery.toLowerCase()));
          return matchBranch && matchSearch;
        });
      }, [rawData, selectedBranch, searchQuery, mappedFields]);

      const metrics = React.useMemo(() => {
        if (!rawData.length) return { totalSales: 0, totalOrders: 0, avgOrderValue: 0, refundRate: 0, topProducts: [], branchSales: {}, channelSales: {}, reliabilityScore: 100 };

        let totalSales = 0;
        let refundCount = 0;
        const productMap = {};
        const branchMap = {};
        const channelMap = {};

        filteredData.forEach(row => {
          const s = Number(row[mappedFields.sales]) || 0;
          const p = row[mappedFields.product] || '기타 상품';
          const b = row[mappedFields.branch] || '지점 미지정';
          const c = row[mappedFields.channel] || '채널 미지정';

          totalSales += s;
          if (s < 0) refundCount++;

          productMap[p] = (productMap[p] || 0) + s;
          branchMap[b] = (branchMap[b] || 0) + s;
          channelMap[c] = (channelMap[c] || 0) + s;
        });

        const totalOrders = filteredData.length;
        const avgOrderValue = totalOrders > 0 ? Math.round(totalSales / totalOrders) : 0;
        const refundRate = totalOrders > 0 ? ((refundCount / totalOrders) * 100).toFixed(1) : 0;

        const topProducts = Object.entries(productMap)
          .map(([name, sales]) => ({ name, sales }))
          .sort((a, b) => b.sales - a.sales);

        const activeMappedCols = Object.values(mappedFields).filter(Boolean);
        let validCells = 0;
        let totalCells = filteredData.length * activeMappedCols.length;

        if (totalCells > 0) {
          filteredData.forEach(row => {
            activeMappedCols.forEach(col => {
              const val = row[col];
              if (val !== null && val !== undefined && String(val).trim() !== '' && String(val) !== '-') {
                validCells++;
              }
            });
          });
        }

        const reliabilityScore = totalCells > 0 ? Math.min(100, Math.round((validCells / totalCells) * 100)) : 100;

        return { totalSales, totalOrders, avgOrderValue, refundRate, topProducts, branchSales: branchMap, channelSales: channelMap, reliabilityScore };
      }, [filteredData, mappedFields, rawData]);

      const generateAIReport = async () => {
        setIsReportLoading(true);
        const userPrompt = `
다음 비즈니스 분석 데이터를 기반으로 CEO 및 경영진을 위한 심층 경영 전략 보고서를 한글 Markdown 형식으로 작성해 주세요.

[경영 핵심 지표 Summary]
- 총 매출액: ${metrics.totalSales.toLocaleString()}원
- 총 건수: ${metrics.totalOrders.toLocaleString()}건
- 평균 주문 금액: ${metrics.avgOrderValue.toLocaleString()}원
- 반품/취소 비율: ${metrics.refundRate}%
- 상위 인기 상품 TOP 3: ${metrics.topProducts.slice(0, 3).map(p => `${p.name}(${p.sales.toLocaleString()}원)`).join(', ')}

[보고서 작성 가이드라인]
1. Executive Summary (핵심 성과 요약)
2. 매출 및 상품 구조 분석 (80/20 법칙 적용)
3. 리스크 및 반품 요인 관리
4. 향후 3개월 실행 가능한 3대 핵심 전략 제언
`;

        const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash-latest'];
        let success = false;

        if (apiKey) {
          for (const model of models) {
            try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: userPrompt }] }] })
              });
              const data = await res.json();
              if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                setAiReport(data.candidates[0].content.parts[0].text);
                showToast(`Gemini AI (${model}) 전략 보고서 생성이 완료되었습니다.`);
                success = true;
                break;
              }
            } catch (err) {
              console.warn(`Model ${model} failed, trying fallback...`, err);
            }
          }
        }

        if (!success) {
          const fallbackText = `
# 📊 [실데이터 기반] Executive AI 비즈니스 분석 보고서

## 1. Executive Summary
* **누적 총 매출액**: **${metrics.totalSales.toLocaleString()}원** (총 ${metrics.totalOrders.toLocaleString()}건)
* **건당 평균 객단가**: **${metrics.avgOrderValue.toLocaleString()}원**
* **반품/취소 비율**: **${metrics.refundRate}%** (리스크 관리 수준: ${metrics.refundRate > 5 ? '⚠️ 주의 필요' : '✅ 양호'})

---

## 2. 파레토(80/20) 매출 구조 및 핵심 상품 분석
전체 매출을 견인하는 최상위 핵심 품목 현황입니다.
${metrics.topProducts.slice(0, 5).map((p, i) => `${i + 1}. **${p.name}**: ${p.sales.toLocaleString()}원`).join('\n')}

---

## 3. 리스크 진단 및 실행 전략 제언
1. **주요 매출원 집중도 관리**: 상위 ${metrics.topProducts.slice(0, 2).map(p => p.name).join(', ')} 제품군에 대한 재고 안정성 확보가 시급합니다.
2. **반품률 개선 조치**: 현재 반품율이 ${metrics.refundRate}%로 집계되므로 품질 검수 프로세스를 점검할 필요가 있습니다.
3. **채널별 마케팅 효율화**: 매출 비중이 높은 채널을 중심으로 프로모션을 집중 배치하세요.
`;
          setAiReport(fallbackText);
          showToast('로컬 분석 엔진 기반 경영 보고서가 즉시 생성되었습니다.');
        }

        setIsReportLoading(false);
      };

      const handleSendChat = async () => {
        if (!chatInput.trim()) return;
        const userQ = chatInput;
        setChatInput('');
        setChatMessages(prev => [...prev, { role: 'user', text: userQ }]);
        setIsChatLoading(true);

        const prompt = `
당신은 기업 CEO의 1:1 전담 AI 경영 컨설턴트입니다.
현재 기업 데이터 요약:
- 총 매출: ${metrics.totalSales.toLocaleString()}원
- 주문 건수: ${metrics.totalOrders.toLocaleString()}건
- 상위 상품: ${metrics.topProducts.slice(0, 3).map(p => p.name).join(', ')}

질문: ${userQ}
답변 조건: 2~4문장의 신속하고 결단력 있는 대화체 명답을 제시할 것.
`;

        let success = false;
        if (apiKey) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
              const reply = data.candidates[0].content.parts[0].text;
              setChatMessages(prev => [...prev, { role: 'assistant', text: reply }]);
              success = true;
            }
          } catch (e) {
            console.error(e);
          }
        }

        if (!success) {
          const fallbackReply = `현재 질문하신 [${userQ}]에 대해 데이터 분석 결과, 누적 매출 ${metrics.totalSales.toLocaleString()}원 중 상위 품목인 ${metrics.topProducts[0]?.name || '주력 상품'}이(가) 주요 성과를 이끌고 있습니다. 해당 항목의 재고 및 프로모션을 정밀 점검하는 것을 추천해 드립니다.`;
          setChatMessages(prev => [...prev, { role: 'assistant', text: fallbackReply }]);
        }

        setIsChatLoading(false);
      };

      const handleDataCleaning = () => {
        if (!rawData.length) return;
        const activeCols = Object.values(mappedFields).filter(Boolean);
        const cleaned = rawData.filter(row => {
          return activeCols.every(col => {
            const v = row[col];
            return v !== null && v !== undefined && String(v).trim() !== '' && String(v) !== '-';
          });
        });

        setRawData(cleaned);
        showToast(`불완전 레코드가 정제되어 데이터 신뢰도가 100점으로 보정되었습니다.`);
      };

      React.useEffect(() => {
        if (activeTab !== 'dashboard' || !rawData.length) return;

        const ctx1 = document.getElementById('chartBranch');
        const ctx2 = document.getElementById('chartTopProducts');

        let chart1, chart2;

        if (ctx1) {
          const labels = Object.keys(metrics.branchSales);
          const dataVals = Object.values(metrics.branchSales);
          chart1 = new Chart(ctx1, {
            type: 'doughnut',
            data: {
              labels,
              datasets: [{
                data: dataVals,
                backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom' } }
            }
          });
        }

        if (ctx2) {
          const top5 = metrics.topProducts.slice(0, 5);
          chart2 = new Chart(ctx2, {

                  <button
                    onClick={handleSendChat}
                    className="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-xl text-xs transition"
                  >
                    전송
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Desktop Floating AI Chat Trigger Button */}
          {rawData.length > 0 && !showChatDrawer && (
            <button
              onClick={() => setShowChatDrawer(true)}
              className="hidden md:flex fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white p-3.5 rounded-full shadow-2xl z-40 items-center gap-2 text-xs font-semibold hover:scale-105 transition"
            >
              <span>💬</span>
              <span>AI 컨설턴트 Q&A</span>
            </button>
          )}

          {/* API Key Modal */}
          {showKeyModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 space-y-4">
                <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                  <span>🔑</span> Google Gemini API 키 설정
                </h3>
                <p className="text-xs text-slate-500 leading-relaxed">
                  Google AI Studio에서 무료로 발급받으신 API 키를 등록해 주세요.<br />
                  키는 사용자 스마트폰/PC의 브라우저에만 암호화 저장됩니다.
                </p>
                <input
                  type="password"
                  placeholder="AIzaSy..."
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  className="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setShowKeyModal(false)}
                    className="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl"
                  >
                    취소
                  </button>
                  <button
                    onClick={() => saveApiKey(apiKey)}
                    className="px-4 py-2 text-xs font-semibold bg-blue-600 text-white rounded-xl shadow-md hover:bg-blue-700"
                  >
                    저장하기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Reset Confirmation Modal */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-4">
                <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                  <span>🔄</span> 데이터 세션 초기화
                </h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  저장된 분석 데이터 및 필드 매핑 설정을 모두 삭제하시겠습니까? 삭제된 세션은 복구할 수 없습니다.
                </p>
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setShowResetModal(false)}
                    className="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl"
                  >
                    취소
                  </button>
                  <button
                    onClick={executeResetData}
                    className="px-4 py-2 text-xs font-semibold bg-rose-600 text-white rounded-xl shadow-md hover:bg-rose-700"
                  >
                    초기화
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Field Mapping Modal */}
          {showMappingModal && rawData.length > 0 && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
                <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                  <span>⚙️</span> 맞춤 필드 매핑 설정
                </h3>
                <p className="text-xs text-slate-500">
                  업로드된 엑셀 열(Header) 중 각 분석 항목에 맞는 열을 선택하세요.
                </p>

                <div className="space-y-3 pt-2">
                  {[
                    { key: 'date', label: '📅 거래일자 (Date)' },
                    { key: 'sales', label: '💵 매출액 (Sales Amount)' },
                    { key: 'product', label: '📦 상품명 (Product)' },
                    { key: 'branch', label: '🏢 지점/매장 (Branch)' },
                    { key: 'channel', label: '🌐 판매 채널 (Channel)' },
                    { key: 'brand', label: '🏷️ 브랜드 (Brand)' },
                    { key: 'qty', label: '🔢 수량 (Quantity)' }
                  ].map(field => (
                    <div key={field.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1 sm:gap-2">
                      <label className="text-xs font-semibold text-slate-700">{field.label}</label>
                      <select
                        value={mappedFields[field.key] || ''}
                        onChange={(e) => setMappedFields({ ...mappedFields, [field.key]: e.target.value })}
                        className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                      >
                        <option value="">미지정</option>
                        {Object.keys(rawData[0] || {}).map(col => (
                          <option key={col} value={col}>{col}</option>
                        ))}
                      </select>
                    </div>
                  ))}
                </div>

                <div className="flex justify-end gap-2 pt-4 border-t border-slate-100">
                  <button
                    onClick={() => {
                      setShowMappingModal(false);
                      showToast('필드 매핑 설정이 저장되었습니다.');
                    }}
                    className="w-full sm:w-auto px-5 py-2.5 text-xs font-semibold bg-blue-600 text-white rounded-xl shadow-md hover:bg-blue-700"
                  >
                    매핑 적용 및 저장
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
