<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Executive Business AI - 경영 대시보드</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS (Excel Parsing) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-blue-500 selection:text-white pb-20 md:pb-6">
  <div id="root"></div>

  <script type="text/babel">
    const DB_NAME = 'ExecAI_DB_Enterprise';
    const DB_VERSION = 1;
    const STORE_NAME = 'app_session';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    };

    const saveToDB = async (key, value) => {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const safeValue = JSON.parse(JSON.stringify(value));
        store.put(safeValue, key);
        return tx.complete;
      } catch (err) {
        console.error('IndexedDB Save Error:', err);
      }
    };

    const loadFromDB = async (key) => {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        return new Promise((resolve) => {
          const request = store.get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => resolve(null);
        });
      } catch (err) {
        console.error('IndexedDB Load Error:', err);
        return null;
      }
    };

    const removeFromDB = async (key) => {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(key);
      } catch (err) {
        console.error('IndexedDB Delete Error:', err);
      }
    };

    const App = () => {
      const [rawData, setRawData] = React.useState([]);
      const [mappedFields, setMappedFields] = React.useState({
        date: '',
        sales: '',
        product: '',
        branch: '',
        channel: '',
        brand: '',
        qty: ''
      });
      const [apiKey, setApiKey] = React.useState(localStorage.getItem('exec_gemini_api_key') || '');
      const [isRestoring, setIsRestoring] = React.useState(true);
      const [activeTab, setActiveTab] = React.useState('dashboard'); // 'dashboard', 'report', 'quality', 'table'
      const [toastMessage, setToastMessage] = React.useState(null);
      
      // Modals & Drawers
      const [showKeyModal, setShowKeyModal] = React.useState(false);
      const [showMappingModal, setShowMappingModal] = React.useState(false);
      const [showResetModal, setShowResetModal] = React.useState(false);
      const [showChatDrawer, setShowChatDrawer] = React.useState(false);

      // AI States
      const [aiReport, setAiReport] = React.useState('');
      const [isReportLoading, setIsReportLoading] = React.useState(false);
      const [chatMessages, setChatMessages] = React.useState([
        { role: 'assistant', text: '안녕하십니까, 경영진 전담 비즈니스 분석 AI 컨설턴트입니다. 매출 구조, 채널별 수익성, 실적이슈에 관해 질의해 주십시오.' }
      ]);
      const [chatInput, setChatInput] = React.useState('');
      const [isChatLoading, setIsChatLoading] = React.useState(false);

      // Filter States
      const [searchQuery, setSearchQuery] = React.useState('');
      const [selectedBranch, setSelectedBranch] = React.useState('ALL');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      React.useEffect(() => {
        const restoreSession = async () => {
          try {
            const savedData = await loadFromDB('saved_raw_data');
            const savedMapping = await loadFromDB('saved_mapped_fields');
            if (savedData && Array.isArray(savedData) && savedData.length > 0) {
              setRawData(savedData);
              if (savedMapping) setMappedFields(savedMapping);
              showToast(`이전 세션 데이터 ${savedData.length.toLocaleString()}건 및 맞춤 설정이 성공적으로 복원되었습니다.`);
            }
          } catch (e) {
            console.error('Session Restore Fail:', e);
          } finally {
            setIsRestoring(false);
          }
        };
        restoreSession();
      }, []);

      React.useEffect(() => {
        if (isRestoring) return;
        if (rawData.length > 0) {
          saveToDB('saved_raw_data', rawData);
          saveToDB('saved_mapped_fields', mappedFields);
        } else {
          removeFromDB('saved_raw_data');
          removeFromDB('saved_mapped_fields');
        }
      }, [rawData, mappedFields, isRestoring]);

      const handleFileUpload = (e, isAppending = false) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        let totalParsedData = [];
        let completedFiles = 0;

        files.forEach((file) => {
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const bstr = evt.target.result;
              const wb = XLSX.read(bstr, { type: 'binary', cellDates: true });
              const wsname = wb.SheetNames[0];
              const ws = wb.Sheets[wsname];
              const parsedRows = XLSX.utils.sheet_to_json(ws, { defval: '' });

              totalParsedData = [...totalParsedData, ...parsedRows];
            } catch (err) {
              console.error(`File Read Error (${file.name}):`, err);
            } finally {
              completedFiles++;
              if (completedFiles === files.length) {
                if (totalParsedData.length === 0) {
                  showToast('업로드한 파일에서 데이터 항목을 추출하지 못했습니다.');
                  return;
                }

                // Auto Detect Column Mapping for initial upload
                const firstRow = totalParsedData[0];
                const headers = Object.keys(firstRow);
                const autoMapping = { ...mappedFields };

                headers.forEach(h => {
                  const lower = h.toLowerCase();
                  if (!autoMapping.date && (lower.includes('일자') || lower.includes('날짜') || lower.includes('date'))) autoMapping.date = h;
                  if (!autoMapping.sales && (lower.includes('매출') || lower.includes('금액') || lower.includes('amount') || lower.includes('price'))) autoMapping.sales = h;
                  if (!autoMapping.product && (lower.includes('상품') || lower.includes('품목') || lower.includes('item') || lower.includes('product'))) autoMapping.product = h;
                  if (!autoMapping.branch && (lower.includes('지점') || lower.includes('매장') || lower.includes('branch') || lower.includes('store'))) autoMapping.branch = h;
                  if (!autoMapping.channel && (lower.includes('채널') || lower.includes('구분') || lower.includes('channel'))) autoMapping.channel = h;
                  if (!autoMapping.brand && (lower.includes('브랜드') || lower.includes('brand'))) autoMapping.brand = h;
                  if (!autoMapping.qty && (lower.includes('수량') || lower.includes('qty') || lower.includes('quantity'))) autoMapping.qty = h;
                });

                if (isAppending && rawData.length > 0) {
                  const merged = [...rawData, ...totalParsedData];
                  setRawData(merged);
                  showToast(`${files.length}개 파일(${totalParsedData.length.toLocaleString()}건)이 추가 병합되어 총 ${merged.length.toLocaleString()}건이 되었습니다.`);
                } else {
                  setRawData(totalParsedData);
                  setMappedFields(autoMapping);
                  showToast(`${files.length}개 파일에서 총 ${totalParsedData.length.toLocaleString()}건의 경영 데이터가 통합 업로드되었습니다.`);
                }
              }
            }
          };
          reader.readAsBinaryString(file);
        });

        e.target.value = '';
      };

      const loadSampleData = () => {
        const sample = [
          { 날짜: '2026-07-01', 매출액: 4850000, 상품명: '엔터프라이즈 AI 서버 S2', 지점: '서울 본사', 채널: 'B2B 직접계약', 브랜드: 'TechExec', 수량: 2 },
          { 날짜: '2026-07-02', 매출액: 2100000, 상품명: '경영 워크스페이스 모니터 34', 지점: '강남 센터', 채널: '온라인 대표몰', 브랜드: 'OfficeGear', 수량: 3 },
          { 날짜: '2026-07-03', 매출액: -350000, 상품명: '보안 스마트 도킹스테이션 (반품)', 지점: '서울 본사', 채널: '온라인 대표몰', 브랜드: 'OfficeGear', 수량: -1 },
          { 날짜: '2026-07-04', 매출액: 8900000, 상품명: '빅데이터 통합 클라우드 라이선스', 지점: '판교 R&D Center', 채널: 'B2B 직접계약', 브랜드: 'TechExec', 수량: 10 },
          { 날짜: '2026-07-05', 매출액: 1450000, 상품명: '인간공학 퍼스트 클래스 체어', 지점: '부산 지사', 채널: '법인 리스', 브랜드: 'ErgoBiz', 수량: 2 },
          { 날짜: '2026-07-06', 매출액: 6200000, 상품명: '엔터프라이즈 AI 서버 S2', 지점: '서울 본사', 채널: 'B2B 직접계약', 브랜드: 'TechExec', 수량: 3 },
          { 날짜: '2026-07-07', 매출액: 1800000, 상품명: '차세대 암호화 SSD 패키지', 지점: '강남 센터', 채널: '온라인 대표몰', 브랜드: 'OfficeGear', 수량: 5 },
          { 날짜: '2026-07-08', 매출액: 3400000, 상품명: 'AI 서브노트북 프로', 지점: '판교 R&D Center', 채널: '법인 리스', 브랜드: 'TechExec', 수량: 2 }
        ];
        const mapping = { date: '날짜', sales: '매출액', product: '상품명', branch: '지점', channel: '채널', brand: '브랜드', qty: '수량' };
        setRawData(sample);
        setMappedFields(mapping);
        showToast('엔터프라이즈 데모 데이터(8건)가 로드되었습니다.');
      };

      const executeResetData = () => {
        setRawData([]);
        setMappedFields({ date: '', sales: '', product: '', branch: '', channel: '', brand: '', qty: '' });
        removeFromDB('saved_raw_data');
        removeFromDB('saved_mapped_fields');
        setShowResetModal(false);
        showToast('저장된 분석 세션이 안전하게 제거되었습니다.');
      };

      const saveApiKey = (key) => {
        const trimmed = key.trim();
        setApiKey(trimmed);
        localStorage.setItem('exec_gemini_api_key', trimmed);
        setShowKeyModal(false);
        showToast(trimmed ? 'Gemini API 키가 저장되었습니다.' : '저장된 API 키가 삭제되었습니다.');
      };

      const filteredData = React.useMemo(() => {
        return rawData.filter(item => {
          const matchBranch = selectedBranch === 'ALL' || String(item[mappedFields.branch]) === selectedBranch;
          const matchSearch = !searchQuery || Object.values(item).some(val => String(val).toLowerCase().includes(searchQuery.toLowerCase()));
          return matchBranch && matchSearch;
        });
      }, [rawData, selectedBranch, searchQuery, mappedFields]);

      const metrics = React.useMemo(() => {
        if (!rawData.length) return { totalSales: 0, totalOrders: 0, avgOrderValue: 0, refundRate: 0, topProducts: [], branchSales: {}, channelSales: {}, reliabilityScore: 100 };

        let totalSales = 0;
        let refundCount = 0;
        const productMap = {};
        const branchMap = {};
        const channelMap = {};

        filteredData.forEach(row => {
          const s = Number(row[mappedFields.sales]) || 0;
          const p = row[mappedFields.product] || '기타 상품';
          const b = row[mappedFields.branch] || '지점 미지정';
          const c = row[mappedFields.channel] || '채널 미지정';

          totalSales += s;
          if (s < 0) refundCount++;

          productMap[p] = (productMap[p] || 0) + s;
          branchMap[b] = (branchMap[b] || 0) + s;
          channelMap[c] = (channelMap[c] || 0) + s;
        });

        const totalOrders = filteredData.length;
        const avgOrderValue = totalOrders > 0 ? Math.round(totalSales / totalOrders) : 0;
        const refundRate = totalOrders > 0 ? ((refundCount / totalOrders) * 100).toFixed(1) : 0;

        const topProducts = Object.entries(productMap)
          .map(([name, sales]) => ({ name, sales }))
          .sort((a, b) => b.sales - a.sales);

        // Data Quality Matrix Calculation
        const activeMappedCols = Object.values(mappedFields).filter(Boolean);
        let validCells = 0;
        let totalCells = filteredData.length * activeMappedCols.length;

        if (totalCells > 0) {
          filteredData.forEach(row => {
            activeMappedCols.forEach(col => {
              const val = row[col];
              if (val !== null && val !== undefined && String(val).trim() !== '' && String(val) !== '-') {
                validCells++;
              }
            });
          });
        }

        const reliabilityScore = totalCells > 0 ? Math.min(100, Math.round((validCells / totalCells) * 100)) : 100;

        return { totalSales, totalOrders, avgOrderValue, refundRate, topProducts, branchSales: branchMap, channelSales: channelMap, reliabilityScore };
      }, [filteredData, mappedFields, rawData]);

      const generateAIReport = async () => {
        setIsReportLoading(true);
        const userPrompt = `
당신은 최고경영진(CEO/CFO)을 위한 수석 전략 컨설턴트입니다.
아래 실무 데이터를 기반으로 명확하고 구체적인 한글 마크다운(Markdown) 보고서를 작성하세요.

[경영 핵심 통계 요약]
- 총 누적 매출액: ${metrics.totalSales.toLocaleString()}원
- 총 처리 거래건수: ${metrics.totalOrders.toLocaleString()}건
- 평균 객단가(AOV): ${metrics.avgOrderValue.toLocaleString()}원
- 취소/반품 비율: ${metrics.refundRate}%
- 파레토 상위 품목 TOP 3: ${metrics.topProducts.slice(0, 3).map(p => `${p.name}(${p.sales.toLocaleString()}원)`).join(', ')}

[보고서 작성 세부 지침]
1. Executive Summary (핵심 실적 관제 및 평가)
2. 매출 및 상품 구조 심층 분석 (Pareto 80/20 법칙 기반)
3. 손실 리스크 및 반품 요인 관리방안
4. 경영진을 위한 향후 3개월 내 실행 과제 (3대 Action Items)
`;

        const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash-latest'];
        let success = false;

        if (apiKey) {
          for (const model of models) {
            try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: userPrompt }] }] })
              });
              const data = await res.json();
              if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                setAiReport(data.candidates[0].content.parts[0].text);
                showToast(`Gemini AI (${model}) 수석 리포트 작성이 완료되었습니다.`);
                success = true;
                break;
              }
            } catch (err) {
              console.warn(`Model ${model} execution failed, switching to fallback...`, err);
            }
          }
        }

        if (!success) {
          const fallbackText = `
# 📊 [Executive Analysis] 비즈니스 경영 전략 보고서

## 1. Executive Summary (실적 요약)
* **총 매출 규모**: **${metrics.totalSales.toLocaleString()}원** (총 처리건수: ${metrics.totalOrders.toLocaleString()}건)
* **거래당 평균 객단가(AOV)**: **${metrics.avgOrderValue.toLocaleString()}원**
* **취소/반품 모니터링**: **${metrics.refundRate}%** (리스크 등급: ${metrics.refundRate > 5 ? '⚠️ 집중 관제' : '✅ 안정적인 컨트롤'})

---

## 2. Pareto (80/20) 매출 집중도 분석
실적 창출 기여도가 가장 높은 핵심 파레토 품목 라인업입니다.
${metrics.topProducts.slice(0, 5).map((p, i) => `${i + 1}. **${p.name}**: ${p.sales.toLocaleString()}원`).join('\n')}

---

## 3. 리스크 컨트롤 및 경영진 액션 플랜
1. **주력 매출원 공급망 안정성 확보**: 상위 품목인 [${metrics.topProducts[0]?.name || '주력 상품'}] 라인에 대한 재고 부족 리스크 사전 예방.
2. **반품률 모니터링 및 프로세스 강화**: 현재 취소/반품 비율 ${metrics.refundRate}% 감축을 위한 출하 검수 단속.
3. **고객 채널별 매출 기여도 극대화**: 핵심 수주 채널에 마케팅 리소스 집중 배치.
`;
          setAiReport(fallbackText);
          showToast('로컬 가드레일 엔진 기반 경영 리포트가 즉시 작성되었습니다.');
        }

        setIsReportLoading(false);
      };

      const handleSendChat = async () => {
        if (!chatInput.trim()) return;
        const userQ = chatInput;
        setChatInput('');
        setChatMessages(prev => [...prev, { role: 'user', text: userQ }]);
        setIsChatLoading(true);

        const prompt = `
당신은 최고경영진 전담 수석 AI 경영 분석가입니다.
기업 내부 데이터:
- 총 누적 매출: ${metrics.totalSales.toLocaleString()}원
- 거래 수주 건수: ${metrics.totalOrders.toLocaleString()}건
- 주력 상위 품목: ${metrics.topProducts.slice(0, 3).map(p => p.name).join(', ')}

질문: ${userQ}
요구사항: 전문적이고 세련된 경영진 보고 언어로 2~3문장의 간결하고 전문적인 가이드를 제공하세요.
`;

        let success = false;
        if (apiKey) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
              const reply = data.candidates[0].content.parts[0].text;
              setChatMessages(prev => [...prev, { role: 'assistant', text: reply }]);
              success = true;
            }
          } catch (e) {
            console.error('AI Chat Error:', e);
          }
        }

        if (!success) {

              >
                <span className="text-base mb-0.5">🛡️</span>
                <span>품질 검증</span>
              </button>

              <button
                onClick={() => setActiveTab('table')}
                className={`flex flex-col items-center justify-center w-full h-full text-[10px] font-medium ${
                  activeTab === 'table' ? 'text-blue-400 font-bold' : 'hover:text-slate-200'
                }`}
              >
                <span className="text-base mb-0.5">📋</span>
                <span>데이터 표</span>
              </button>

              <button
                onClick={() => setShowChatDrawer(true)}
                className="flex flex-col items-center justify-center w-full h-full text-[10px] font-medium text-emerald-400"
              >
                <span className="text-base mb-0.5">💬</span>
                <span>AI 챗봇</span>
              </button>
            </nav>
          )}

          {/* AI Executive Chat Drawer */}
          {showChatDrawer && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex justify-end flex-col md:items-end p-0 md:p-4">
              <div className="bg-white w-full md:w-96 h-[85vh] md:h-[600px] rounded-t-3xl md:rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-slate-200">
                <div className="bg-slate-900 text-white p-4 flex items-center justify-between border-b border-slate-800">
                  <div className="flex items-center gap-2.5">
                    <span className="text-lg">🤖</span>
                    <div>
                      <h4 className="font-bold text-xs sm:text-sm">Executive AI 수석 컨설턴트</h4>
                      <p className="text-[10px] text-emerald-400">실시간 데이터 연동 가동 중</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowChatDrawer(false)}
                    className="text-slate-400 hover:text-white text-lg p-1 transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar bg-slate-50">
                  {chatMessages.map((msg, idx) => (
                    <div
                      key={idx}
                      className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
                    >
                      <div
                        className={`max-w-[85%] p-3.5 rounded-2xl text-xs leading-relaxed ${
                          msg.role === 'user'
                            ? 'bg-blue-600 text-white rounded-br-none shadow-sm'
                            : 'bg-white border border-slate-200 text-slate-800 shadow-sm rounded-bl-none'
                        }`}
                      >
                        {msg.text}
                      </div>
                    </div>
                  ))}
                  {isChatLoading && (
                    <div className="flex justify-start">
                      <div className="bg-white border border-slate-200 p-3 rounded-2xl text-xs text-slate-400 animate-pulse">
                        데이터 요소를 다각도로 검토 중입니다...
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-3 bg-white border-t border-slate-200 flex gap-2">
                  <input
                    type="text"
                    placeholder="경영진 질문 사항 입력..."
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendChat()}
                    className="flex-1 px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <button
                    onClick={handleSendChat}
                    className="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2.5 rounded-xl text-xs transition shadow-sm"
                  >
                    전송
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Desktop AI Assistant Floating Trigger */}
          {rawData.length > 0 && !showChatDrawer && (
            <button
              onClick={() => setShowChatDrawer(true)}
              className="hidden md:flex fixed bottom-6 right-6 bg-slate-900 hover:bg-slate-800 text-white border border-slate-700 px-4 py-3.5 rounded-full shadow-2xl z-40 items-center gap-2 text-xs font-semibold hover:scale-105 transition"
            >
              <span className="text-base">💬</span>
              <span>AI 경영 컨설턴트 질의</span>
            </button>
          )}

          {/* API Key Modal */}
          {showKeyModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 space-y-4">
                <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                  <span>🔑</span> Google Gemini API 키 설정
                </h3>
                <p className="text-xs text-slate-500 leading-relaxed">
                  Google AI Studio에서 무료 발급받으신 API 키를 입력하세요.<br />
                  입력된 키는 사용자 컴퓨터/스마트폰 내부(Browser Store)에만 보안 보관됩니다.
                </p>
                <input
                  type="password"
                  placeholder="AIzaSy..."
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setShowKeyModal(false)}
                    className="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl"
                  >
                    취소
                  </button>
                  <button
                    onClick={() => saveApiKey(apiKey)}
                    className="px-4 py-2 text-xs font-semibold bg-blue-600 text-white rounded-xl shadow-md hover:bg-blue-700"
                  >
                    저장하기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Reset Modal */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-4">
                <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                  <span>🔄</span> 분석 데이터 초기화
                </h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  현재 로드된 경영 데이터와 필드 매핑 세션을 모두 지우시겠습니까?
                </p>
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setShowResetModal(false)}
                    className="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl"
                  >
                    취소
                  </button>
                  <button
                    onClick={executeResetData}
                    className="px-4 py-2 text-xs font-semibold bg-rose-600 text-white rounded-xl shadow-md hover:bg-rose-700"
                  >
                    초기화 실행
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Field Mapping Modal */}
          {showMappingModal && rawData.length > 0 && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
                <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                  <span>⚙️</span> 분석 항목 필드 매핑
                </h3>
                <p className="text-xs text-slate-500">
                  업로드 데이터의 각 컬럼(Header)을 분석 매포에 매칭하십시오.
                </p>

                <div className="space-y-3 pt-2">
                  {[
                    { key: 'date', label: '📅 거래일자 (Date)' },
                    { key: 'sales', label: '💵 매출액 (Sales Amount)' },
                    { key: 'product', label: '📦 상품명 (Product)' },
                    { key: 'branch', label: '🏢 지점/매장 (Branch)' },
                    { key: 'channel', label: '🌐 판매 채널 (Channel)' },
                    { key: 'brand', label: '🏷️ 브랜드 (Brand)' },
                    { key: 'qty', label: '🔢 수량 (Quantity)' }
                  ].map(field => (
                    <div key={field.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1 sm:gap-2">
                      <label className="text-xs font-semibold text-slate-700">{field.label}</label>
                      <select
                        value={mappedFields[field.key] || ''}
                        onChange={(e) => setMappedFields({ ...mappedFields, [field.key]: e.target.value })}
                        className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                      >
                        <option value="">미지정</option>
                        {Object.keys(rawData[0] || {}).map(col => (
                          <option key={col} value={col}>{col}</option>
                        ))}
                      </select>
                    </div>
                  ))}
                </div>

                <div className="flex justify-end gap-2 pt-4 border-t border-slate-100">
                  <button
                    onClick={() => {
                      setShowMappingModal(false);
                      showToast('필드 매핑 설정이 저장되었습니다.');
                    }}
                    className="w-full sm:w-auto px-5 py-2.5 text-xs font-semibold bg-blue-600 text-white rounded-xl shadow-md hover:bg-blue-700"
                  >
                    매핑 적용 및 저장
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
