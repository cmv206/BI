<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 매출 분석 플랫폼</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for High Performance Data Visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS (XLSX) for Browser Excel File Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            zinc: { 950: '#09090b', 900: '#121215', 850: '#18181b', 800: '#27272a' },
            accent: { blue: '#3b82f6', emerald: '#10b981', violet: '#8b5cf6', amber: '#f59e0b', rose: '#f43f5e', indigo: '#6366f1' }
          },
          fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .dark ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #27272a; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    .glass-panel { 
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(12px); 
      border: 1px solid rgba(226, 232, 240, 0.9); 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    }
    .dark .glass-panel { 
      background: rgba(24, 24, 27, 0.7); 
      backdrop-filter: blur(12px); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      box-shadow: none;
    }

    .glass-card { 
      background: rgba(255, 255, 255, 0.95); 
      border: 1px solid rgba(226, 232, 240, 0.8); 
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
    }
    .dark .glass-card { 
      background: rgba(18, 18, 21, 0.6); 
      border: 1px solid rgba(255, 255, 255, 0.06); 
      box-shadow: none;
    }

    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .glass-panel, .glass-card { background: white !important; border: 1px solid #ccc !important; box-shadow: none !important; break-inside: avoid; }
      * { color: black !important; text-shadow: none !important; }
      canvas { max-width: 100% !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen font-sans antialiased selection:bg-blue-600 selection:text-white transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // Safe React Icon wrapper to prevent Lucide DOM replacement conflicts with React Virtual DOM
    const Icon = ({ name, className = "w-4 h-4", color }) => {
      const containerRef = useRef(null);
      const [lucideReady, setLucideReady] = useState(!!window.lucide);

      useEffect(() => {
        if (window.lucide) {
          setLucideReady(true);
          return;
        }
        const interval = setInterval(() => {
          if (window.lucide) {
            setLucideReady(true);
            clearInterval(interval);
          }
        }, 100);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (!containerRef.current || !lucideReady || !window.lucide) return;
        
        const toCamelCase = (s) => s.replace(/-([a-z0-9])/g, (g) => g[1].toUpperCase());
        const toPascalCase = (s) => {
          const c = toCamelCase(s);
          return c.charAt(0).toUpperCase() + c.slice(1);
        };

        const pascal = toPascalCase(name);
        const camel = toCamelCase(name);
        const iconDef = window.lucide.icons?.[pascal] || window.lucide.icons?.[camel] || window.lucide.icons?.[name];

        if (iconDef && window.lucide.createElement) {
          try {
            const svg = window.lucide.createElement(iconDef);
            if (svg) {
              svg.setAttribute('class', className);
              if (color) svg.setAttribute('stroke', color);
              containerRef.current.innerHTML = '';
              containerRef.current.appendChild(svg);
            }
          } catch (err) {
            console.warn('Lucide icon render warning:', name, err);
          }
        }
      }, [name, className, color, lucideReady]);

      return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" />;
    };

    // Helper: Parse varied Excel date formats (Strings, Numbers, Serial dates)
    const parseExcelDate = (val) => {
      if (!val) return '2026-01-01';
      if (typeof val === 'number') {
        const jsDate = new Date(Math.round((val - 25569) * 86400 * 1000));
        if (!isNaN(jsDate.getTime())) {
          const y = jsDate.getFullYear();
          const m = String(jsDate.getMonth() + 1).padStart(2, '0');
          const d = String(jsDate.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        }
      }
      const str = String(val).trim().replace(/\./g, '-').replace(/\//g, '-');
      if (str.length === 8 && !str.includes('-')) {
        return `${str.substring(0,4)}-${str.substring(4,6)}-${str.substring(6,8)}`;
      }
      const match = str.match(/\d{4}-\d{1,2}-\d{1,2}/);
      if (match) {
        const parts = match[0].split('-');
        return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
      }
      return '2026-01-01';
    };

    const MathUtils = {
      mean: (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0,
      median: (arr) => {
        if (!arr.length) return 0;
        const sorted = [...arr].sort((a, b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
      },
      variance: (arr, mean) => arr.length ? arr.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / arr.length : 0,
      stdDev: (arr, mean) => Math.sqrt(MathUtils.variance(arr, mean)),
      zScore: (val, mean, stdDev) => stdDev === 0 ? 0 : (val - mean) / stdDev,
      mode: (arr) => {
        if (!arr.length) return 0;
        const counts = {}; let max = 0; let mode = arr[0];
        arr.forEach(el => { counts[el] = (counts[el] || 0) + 1; if(counts[el] > max) { max = counts[el]; mode = el; } });
        return mode;
      }
    };

    const aggregateByField = (sales, keyField) => {
      const map = {};
      sales.forEach(r => {
        const k = String(r[keyField] || '기타');
        if (!map[k]) map[k] = { id: k, name: k, netRev: 0, grossRev: 0, qty: 0, margin: 0, count: 0, priceSum: 0 };
        map[k].netRev += (r.netRevenue || 0);
        map[k].grossRev += (r.grossRevenue || 0);
        map[k].qty += (r.quantity || 0);
        map[k].margin += (r.marginAmount || 0);
        map[k].count++;
        map[k].priceSum += (r.salePrice || 0);
      });
      return map;
    };

    const AIService = {
      insight: {
        generateDashboardInsights: (sales) => {
          if (!sales.length) return ["업로드된 엑셀 데이터가 없습니다. 상단 '엑셀 업로드' 버튼을 통해 매출 파일을 추가하세요."];
          const sorted = [...sales].sort((a,b) => b.dateId - a.dateId);
          const recent = sorted[0].yearmonth;
          
          let curRev = 0, brandMap = {}, channelMap = {};
          sales.forEach(s => {
            if (s.yearmonth === recent) { 
              curRev += s.netRevenue; 
              brandMap[s.brandName] = (brandMap[s.brandName] || 0) + s.netRevenue;
              channelMap[s.channelName] = (channelMap[s.channelName] || 0) + s.netRevenue;
            }
          });
          
          const topBrandName = Object.keys(brandMap).sort((a,b) => brandMap[b] - brandMap[a])[0] || '기타';
          const topChannelName = Object.keys(channelMap).sort((a,b) => channelMap[b] - channelMap[a])[0] || '기타';
          
          return [
            `📈 ${recent} 기준 최신 순매출 총액은 ₩${Math.round(curRev).toLocaleString()}원입니다.`,
            `🔥 가장 높은 매출 기여도를 보인 브랜드는 [${topBrandName}] 입니다.`,
            `🛒 주력 매출 발생 채널은 [${topChannelName}] 채널입니다.`
          ];
        }
      },
      pricing: {
        analyzeProductPricing: (productSales) => {
          const prices = productSales.filter(s => s.quantity > 0).map(s => s.salePrice);
          if (!prices.length) return null;
          const mean = MathUtils.mean(prices);
          const median = MathUtils.median(prices);
          const mode = MathUtils.mode(prices);
          const v = MathUtils.variance(prices, mean);
          
          let recPrice = mode || mean;
          let reason = "가장 높은 판매 빈도를 보인 가격(최빈가)을 추천 기준 판매가로 설정합니다.";
          if (mean < median * 0.9) { 
            recPrice = median; 
            reason = "할인율 누적으로 평균 단가가 낮아진 상태입니다. 마진 방어를 위해 판매가 조정을 추천합니다."; 
          }
          
          const listPrice = productSales[0]?.unitPrice || recPrice;
          const recDisc = listPrice ? Math.max(0, ((listPrice - recPrice) / listPrice * 100)).toFixed(1) : 0;
          
          return { currentAvg: mean, median, mode, variance: v, recPrice, recDisc, reason };
        }
      },
      inventory: {
        assessRisk: (productSales, currentStock = 100, incomingStock = 0) => {
          const wMap = aggregateByField(productSales, 'yearweek');
          const weeks = Object.keys(wMap).slice(-8);
          const avgWeekly = weeks.length ? MathUtils.mean(weeks.map(w => wMap[w].qty)) : 0;
          
          const totalStock = currentStock + incomingStock;
          const weeksCovered = avgWeekly > 0 ? totalStock / avgWeekly : 999;
          
          let status = '정상', riskLevel = '낮음', action = '현상 유지';
          if (weeksCovered < 4) { status = '재고 부족 위험'; riskLevel = '높음'; action = '긴급 발주 필요'; }
          else if (weeksCovered > 12) { status = '과다 재고'; riskLevel = '높음'; action = '할인 프로모션 권장'; }
          
          return { burnRate: avgWeekly.toFixed(1), weeksCovered: weeksCovered < 99 ? weeksCovered.toFixed(1) : '-', status, riskLevel, action };
        }
      },
      anomaly: {
        detect: (sales) => {
          if (!sales.length) return [];
          const anomalies = [];
          const pMap = {};
          sales.forEach(s => { 
            if (!pMap[s.productCode]) pMap[s.productCode] = { prices: [], qtys: [] }; 
            pMap[s.productCode].prices.push(s.salePrice); 
            pMap[s.productCode].qtys.push(s.quantity); 
          });
          
          for (const code in pMap) {
            pMap[code].priceMean = MathUtils.mean(pMap[code].prices); 
            pMap[code].priceStd = MathUtils.stdDev(pMap[code].prices, pMap[code].priceMean);
            pMap[code].qtyMean = MathUtils.mean(pMap[code].qtys); 
            pMap[code].qtyStd = MathUtils.stdDev(pMap[code].qtys, pMap[code].qtyMean);
          }
          
          sales.forEach(s => {
            const zPrice = Math.abs(MathUtils.zScore(s.salePrice, pMap[s.productCode].priceMean, pMap[s.productCode].priceStd));
            const zQty = Math.abs(MathUtils.zScore(s.quantity, pMap[s.productCode].qtyMean, pMap[s.productCode].qtyStd));
            
            if (zPrice > 3) anomalies.push({ date: s.fullDate, sku: s.productCode, type: '비정상 판매가', value: `₩${Math.round(s.salePrice).toLocaleString()}`, severity: '높음' });
            if (zQty > 3 && s.quantity > 0) anomalies.push({ date: s.fullDate, sku: s.productCode, type: '판매량 급증', value: `${s.quantity}개`, severity: '보통' });
          });
          return anomalies.slice(-50).reverse();
        }
      },
      nlp: {
        search: (query, sales) => {
          if (!sales.length) return "현재 업로드된 매출 데이터가 없습니다. 먼저 엑셀 파일(.xlsx)을 업로드하세요.";
          if (query.includes('성장') || query.includes('베스트') || query.includes('1위')) {
            const pMap = aggregateByField(sales, 'productName');
            const top = Object.keys(pMap).sort((a,b) => pMap[b].netRev - pMap[a].netRev)[0];
            return `현재 전체 순매출 1위 상품은 [${top || 'N/A'}] 입니다.`;
          }
          if (query.includes('브랜드')) {
            const bMap = aggregateByField(sales, 'brandName');
            const topB = Object.keys(bMap).sort((a,b) => bMap[b].netRev - bMap[a].netRev)[0];
            return `가장 높은 매출을 창출 중인 브랜드는 [${topB || 'N/A'}] 입니다.`;
          }
          return "업로드된 데이터 기반 분석 결과입니다. 원하시는 조건(예: 가장 많이 팔린 상품, 최상위 브랜드 등)을 질문해보세요.";
        }
      }
    };

    const exportCSV = (filename, rows) => {
      if (!rows || !rows.length) return;
      const headers = Object.keys(rows[0]).join(',');
      const csvContent = [headers, ...rows.map(r => Object.values(r).map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))].join('\n');
      const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${filename}.csv`; link.click();
    };

    const calculateKPIs = (sales) => {
      let netRev = 0, grossRev = 0, qty = 0, margin = 0;
      const bSet = new Set(), sSet = new Set(), cSet = new Set(), stSet = new Set();
      sales.forEach(r => {
        netRev += (r.netRevenue || 0); 
        grossRev += (r.grossRevenue || 0); 
        qty += (r.quantity || 0); 
        margin += (r.marginAmount || 0);
        if (r.quantity !== 0) { 
          if (r.brandName) bSet.add(r.brandName); 
          if (r.productCode) sSet.add(r.productCode); 
          if (r.channelName) cSet.add(r.channelName); 
          if (r.storeName) stSet.add(r.storeName); 
        }
      });
      return {
        netRev, grossRev, qty, margin, asp: qty ? Math.round(netRev / qty) : 0,
        marginRate: netRev ? (margin / netRev * 100).toFixed(1) : 0, 
        discountRate: grossRev ? ((grossRev - netRev) / grossRev * 100).toFixed(1) : 0,
        brands: bSet.size, skus: sSet.size, channels: cSet.size, stores: stSet.size
      };
    };

    function App() {
      const [theme, setTheme] = useState('light');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [analyticsSubTab, setAnalyticsSubTab] = useState('best');
      const [selectedProductCode, setSelectedProductCode] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [isUploadOpen, setIsUploadOpen] = useState(false);

      const [salesData, setSalesData] = useState([]);
      const [uploadHistory, setUploadHistory] = useState([]);

      const [filters, setFilters] = useState({ 
        startDate: '2020-01-01', 
        endDate: '2030-12-31', 
        brandName: '', 
        channelName: '', 
        storeName: '', 
        searchKeyword: '' 
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') { root.classList.add('dark'); } else { root.classList.remove('dark'); }
      }, [theme]);

      const toggleTheme = () => setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));

      const handleFilterChange = (newFilters) => { 
        setIsLoading(true); 
        setFilters(newFilters); 
        setTimeout(() => setIsLoading(false), 100); 
      };

      const dynamicBrands = useMemo(() => {
        const set = new Set(); salesData.forEach(s => { if (s.brandName) set.add(s.brandName); });
        return Array.from(set).sort();
      }, [salesData]);

      const dynamicChannels = useMemo(() => {
        const set = new Set(); salesData.forEach(s => { if (s.channelName) set.add(s.channelName); });
        return Array.from(set).sort();
      }, [salesData]);

      const dynamicStores = useMemo(() => {
        const set = new Set(); salesData.forEach(s => { if (s.storeName) set.add(s.storeName); });
        return Array.from(set).sort();
      }, [salesData]);

      const filteredSales = useMemo(() => {
        return salesData.filter(item => {
          if (item.fullDate < filters.startDate || item.fullDate > filters.endDate) return false;
          if (filters.brandName && item.brandName !== filters.brandName) return false;
          if (filters.channelName && item.channelName !== filters.channelName) return false;
          if (filters.storeName && item.storeName !== filters.storeName) return false;
          if (filters.searchKeyword.trim() !== '') {
            const kw = filters.searchKeyword.toLowerCase();
            const nameMatch = item.productName && item.productName.toLowerCase().includes(kw);
            const codeMatch = item.productCode && item.productCode.toLowerCase().includes(kw);
            if (!nameMatch && !codeMatch) return false;
          }
          return true;
        });
      }, [salesData, filters]);

      const navigateTo = (tab, subTab = null, data = null) => {
        setIsLoading(true); 
        setActiveTab(tab);
        if (subTab) setAnalyticsSubTab(subTab);
        if (tab === 'product_detail' && data) setSelectedProductCode(data);
        setTimeout(() => setIsLoading(false), 100);
      };

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-slate-50 dark:bg-zinc-950 text-slate-800 dark:text-zinc-100 transition-colors duration-200">
          <header className="no-print h-14 border-b border-slate-200 dark:border-zinc-800 bg-white/90 dark:bg-zinc-900/80 backdrop-blur-md flex items-center justify-between px-3 md:px-4 z-20 shrink-0 shadow-xs dark:shadow-none gap-2">
            <div className="flex items-center gap-2 shrink-0">
              <div className="w-7 h-7 rounded-lg bg-gradient-to-tr from-violet-600 to-blue-500 flex items-center justify-center font-black text-white text-xs shadow-md shadow-violet-500/20">AI</div>
              <h1 className="font-bold text-xs sm:text-sm tracking-tight text-slate-900 dark:text-white whitespace-nowrap">
                AI판매분석
              </h1>
            </div>

            <nav className="flex items-center gap-1 bg-slate-100 dark:bg-zinc-950/60 p-1 rounded-lg border border-slate-200 dark:border-zinc-800 shrink-0">
              <NavBtn active={activeTab === 'dashboard'} onClick={() => navigateTo('dashboard')} icon="layout-dashboard" label="대시보드" />
              <NavBtn active={activeTab === 'analytics'} onClick={() => navigateTo('analytics')} icon="bar-chart-2" label="매출 분석" />
              <NavBtn active={activeTab === 'products' || activeTab === 'product_detail'} onClick={() => navigateTo('products')} icon="package" label="상품 카탈로그" />
              <div className="w-px h-4 bg-slate-300 dark:bg-zinc-700 mx-0.5"></div>
              <NavBtn active={activeTab === 'anomaly'} onClick={() => navigateTo('anomaly')} icon="alert-triangle" label="이상치 탐지" color="rose" />
              <NavBtn active={activeTab === 'purchase'} onClick={() => navigateTo('purchase')} icon="shopping-cart" label="AI 발주 추천" color="emerald" />
              <NavBtn active={activeTab === 'report'} onClick={() => navigateTo('report')} icon="file-text" label="경영진 리포트" color="violet" />
            </nav>

            <div className="flex items-center gap-1.5 shrink-0">
              <button 
                onClick={() => setIsUploadOpen(true)}
                className="flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold shadow-xs transition whitespace-nowrap"
                title="엑셀 파일 업로드"
              >
                <Icon name="upload-cloud" className="w-3.5 h-3.5" />
                <span>엑셀 업로드</span>
              </button>

              <button 
                onClick={toggleTheme} 
                className="flex items-center gap-1 bg-slate-100 hover:bg-slate-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-slate-700 dark:text-zinc-200 px-2 py-1.5 rounded-lg border border-slate-200 dark:border-zinc-700 transition text-xs font-semibold whitespace-nowrap"
                title="화면 테마 변경"
              >
                <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-3.5 h-3.5 text-amber-500 dark:text-indigo-400" />
                <span className="hidden sm:inline">{theme === 'dark' ? '라이트' : '다크'}</span>
              </button>

              <button onClick={() => setIsChatOpen(!isChatOpen)} className="flex items-center gap-1 bg-violet-600/10 hover:bg-violet-600/20 dark:bg-violet-600/20 dark:hover:bg-violet-600/40 text-violet-700 dark:text-violet-300 px-2.5 py-1.5 rounded-lg border border-violet-500/30 transition text-xs font-semibold whitespace-nowrap">
                <Icon name="sparkles" className="w-3.5 h-3.5 text-violet-600 dark:text-violet-300" />
                <span>AI 검색</span>
              </button>
            </div>
          </header>

          {isChatOpen && <AIChatModal onClose={() => setIsChatOpen(false)} sales={filteredSales} />}
          {isUploadOpen && (
            <ExcelUploadModal 
              onClose={() => setIsUploadOpen(false)} 
              salesData={salesData} 
              setSalesData={setSalesData}
              uploadHistory={uploadHistory}
              setUploadHistory={setUploadHistory}
            />
          )}

          <div className="no-print bg-white/70 dark:bg-zinc-900/50 border-b border-slate-200 dark:border-zinc-800 px-5 py-2.5 shrink-0 flex items-center justify-between shadow-xs">
             <div className="flex flex-wrap items-center gap-2.5 w-full">
                <div className="flex items-center gap-1.5 mr-2">
                  <Icon name="filter" className="w-4 h-4 text-blue-500 dark:text-blue-400" />
                  <span className="text-[11px] font-bold text-slate-800 dark:text-white uppercase tracking-wider">전체 필터</span>
                </div>
                <input type="date" value={filters.startDate} onChange={e => handleFilterChange({...filters, startDate: e.target.value})} className="bg-white dark:bg-zinc-950 border border-slate-300 dark:border-zinc-700 text-[11px] rounded px-2 py-1 text-slate-800 dark:text-white focus:border-blue-500 outline-none shadow-xs" />
                <span className="text-slate-400 dark:text-zinc-500 text-xs">~</span>
                <input type="date" value={filters.endDate} onChange={e => handleFilterChange({...filters, endDate: e.target.value})} className="bg-white dark:bg-zinc-950 border border-slate-300 dark:border-zinc-700 text-[11px] rounded px-2 py-1 text-slate-800 dark:text-white focus:border-blue-500 outline-none shadow-xs" />
                
                <select value={filters.brandName} onChange={e => handleFilterChange({...filters, brandName: e.target.value})} className="bg-white dark:bg-zinc-950 border border-slate-300 dark:border-zinc-700 text-[11px] rounded px-2 py-1 text-slate-800 dark:text-white outline-none shadow-xs">
                  <option value="">전체 브랜드 ({dynamicBrands.length})</option>
                  {dynamicBrands.map(b => <option key={b} value={b}>{b}</option>)}
                </select>

                <select value={filters.channelName} onChange={e => handleFilterChange({...filters, channelName: e.target.value})} className="bg-white dark:bg-zinc-950 border border-slate-300 dark:border-zinc-700 text-[11px] rounded px-2 py-1 text-slate-800 dark:text-white outline-none shadow-xs">
                  <option value="">전체 채널 ({dynamicChannels.length})</option>
                  {dynamicChannels.map(c => <option key={c} value={c}>{c}</option>)}
                </select>

                <select value={filters.storeName} onChange={e => handleFilterChange({...filters, storeName: e.target.value})} className="bg-white dark:bg-zinc-950 border border-slate-300 dark:border-zinc-700 text-[11px] rounded px-2 py-1 text-slate-800 dark:text-white outline-none shadow-xs">
                  <option value="">전체 지점 ({dynamicStores.length})</option>
                  {dynamicStores.map(s => <option key={s} value={s}>{s}</option>)}
                </select>

                <div className="ml-auto relative">
                  <Icon name="search" className="w-3 h-3 absolute left-2 top-2 text-slate-400 dark:text-zinc-500" />
                  <input type="text" placeholder="상품명/코드 검색..." value={filters.searchKeyword} onChange={e => handleFilterChange({...filters, searchKeyword: e.target.value})} className="bg-white dark:bg-zinc-950 border border-slate-300 dark:border-zinc-700 text-[11px] rounded pl-7 pr-2 py-1 text-slate-800 dark:text-white outline-none w-44 shadow-xs" />
                </div>
             </div>
          </div>

          <main className="flex-1 overflow-y-auto p-5 relative print-only-scroll">
            {isLoading && <div className="absolute inset-0 z-10 bg-slate-100/50 dark:bg-zinc-950/50 backdrop-blur-xs flex items-center justify-center"><Icon name="loader-2" className="w-8 h-8 text-blue-500 animate-spin" /></div>}
            
            {salesData.length === 0 ? (
              <EmptyDataBanner onUploadClick={() => setIsUploadOpen(true)} />
            ) : (
              <div className={`transition-opacity duration-300 ${isLoading ? 'opacity-30' : 'opacity-100'}`}>
                {activeTab === 'dashboard' && <DashboardView sales={filteredSales} navigateTo={navigateTo} theme={theme} />}
                {activeTab === 'analytics' && <AnalyticsView sales={filteredSales} subTab={analyticsSubTab} setSubTab={setAnalyticsSubTab} navigateTo={navigateTo} />}
                {activeTab === 'products' && <ProductsExplorerView sales={filteredSales} navigateTo={navigateTo} />}
                {activeTab === 'product_detail' && <ProductDetailFullView sales={filteredSales} allSales={salesData} productCode={selectedProductCode} navigateTo={navigateTo} theme={theme} />}
                {activeTab === 'anomaly' && <AnomalyCenterView allSales={filteredSales} />}
                {activeTab === 'purchase' && <PurchaseRecommendationView sales={filteredSales} />}
                {activeTab === 'report' && <ExecutiveReportView sales={filteredSales} />}
              </div>
            )}
          </main>
        </div>
      );
    }

    function EmptyDataBanner({ onUploadClick }) {
      return (
        <div className="flex flex-col items-center justify-center min-h-[60vh] p-8 text-center glass-panel rounded-2xl border border-dashed border-slate-300 dark:border-zinc-800 space-y-4 max-w-2xl mx-auto my-8">
          <div className="w-16 h-16 rounded-2xl bg-blue-500/10 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 flex items-center justify-center shadow-inner">
            <Icon name="file-spreadsheet" className="w-8 h-8" />
          </div>
          <div className="space-y-1.5">
            <h2 className="text-base font-bold text-slate-900 dark:text-white">업로드된 매출 로우데이터가 없습니다</h2>
            <p className="text-xs text-slate-500 dark:text-zinc-400 max-w-md mx-auto leading-relaxed">
              분석할 SAP 엑셀 파일(.xlsx)을 업로드하면, 예시 데이터 없이 <strong>실제 로우데이터만을 기준으로</strong> KPI, 브랜드/채널별 점유율, 상품 실적이 자동 계산됩니다.
            </p>
          </div>
          <button 
            onClick={onUploadClick} 
            className="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-md transition-all flex items-center gap-2"
          >
            <Icon name="upload-cloud" className="w-4 h-4" />
            <span>엑셀 파일 업로드하기</span>
          </button>
        </div>
      );
    }

    function ExcelUploadModal({ onClose, salesData, setSalesData, uploadHistory, setUploadHistory }) {
      const [strategy, setStrategy] = useState('overwrite');
      const [parsedFilesInfo, setParsedFilesInfo] = useState([]);
      const [isProcessing, setIsProcessing] = useState(false);
      const [message, setMessage] = useState('');
      const [step, setStep] = useState(1);
      const fileInputRef = useRef(null);

      const targetFields = [
        { key: 'date', label: '날짜/일자', keywords: ['일자', '날짜', '영업일자', '판매일', '주문일', '출고일', '결제일', 'date'] },
        { key: 'order', label: '주문/전표번호', keywords: ['주문번호', '전표번호', '주문전표번호', '주문no', 'orderno', 'ord_no', 'order'] },
        { key: 'code', label: '상품코드(SKU)', keywords: ['자사상품코드', '상품코드', 'sku코드', '품목코드', '외부몰상품코드', 'sku', 'code'] },
        { key: 'name', label: '상품명', keywords: ['외부몰 상품명', '외부몰상품명', '자사상품명', '상품명', '품목명', '제품명', 'item', 'product'] },
        { key: 'brand', label: '브랜드명', keywords: ['브랜드 내역', '브랜드내역', '브랜드명', '자사브랜드', '브랜드', 'brand'] },
        { key: 'category', label: '카테고리', keywords: ['카테고리', '대분류', '중분류', '품목군', 'category'] },
        { key: 'channel', label: '판매채널', keywords: ['판매채널', '유통채널', '채널명', '채널', '구분', '채널구분', 'channel'] },
        { key: 'store', label: '지점/매장(플랜트)', keywords: ['플랜트명', '플랜트', '지점명', '지점', '매장명', '매장', '점포명', '점포', 'store'] },
        { key: 'option', label: '옵션/규격', keywords: ['옵션명', '옵션', '규격', '색상', '사이즈', 'option'] },
        { key: 'qty', label: '판매수량', keywords: ['판매수량', '수량', '출고수량', 'qty', 'quantity'] },
        { key: 'price', label: '정가/단가', keywords: ['소비자가', '정가', '단가', '표준단가', 'unitprice', 'price'] },
        { key: 'disc', label: '할인금액', keywords: ['할인금액', '할인액', '할인단가', '할인', 'discount'] },
        { key: 'salePrice', label: '실판매가/결제액', keywords: ['실판매가', '판매금액', '판매가', '결제금액', '판매단가', 'saleprice', '금액'] },
        { key: 'cost', label: '원가/공급가', keywords: ['원가', '공급가', '제조원가', '매입가', 'cost'] }
      ];

      const PLANT_MAP = {
        'R100': '본사(R100)',
        'R110': '강남점(R110)',
        'R120': '명동점(R120)',
        'R130': '홍대점(R130)',
        'R200': '백화점(R200)',
        'R300': '아울렛(R300)',
        'R400': '온라인(R400)',
        'R500': '면세점(R500)',
        '1000': '본사(1000)'
      };

      const [customKeyMap, setCustomKeyMap] = useState({});
      const [detectedHeaders, setDetectedHeaders] = useState([]);
      const [rawJsonRows, setRawJsonRows] = useState([]);

      const readSheetHeadersAndRows = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const data = new Uint8Array(evt.target.result);
              const workbook = XLSX.read(data, { type: 'array', cellDates: false, cellFormulas: false, cellStyles: false });
              const firstSheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[firstSheetName];
              const json = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
              
              if (!json || json.length === 0) {
                resolve({ headers: [], json: [] });
                return;
              }

              const headers = Object.keys(json[0]);
              resolve({ headers, json });
            } catch (err) { reject(err); }
          };
          reader.onerror = (err) => reject(err);
          reader.readAsArrayBuffer(file);
        });
      };

      const processFiles = async (filesList) => {
        const files = Array.from(filesList).filter(f => !f.name.startsWith('~$') && !f.name.startsWith('.'));
        if (!files.length) return;
        
        setIsProcessing(true);
        setMessage(`${files.length}개 파일 파싱 진행 중...`);

        const fileResults = [];
        let allHeaders = new Set();
        let firstFileRows = [];

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          try {
            setMessage(`읽는 중 (${i + 1}/${files.length}): ${file.name}`);
            const { headers, json } = await readSheetHeadersAndRows(file);
            headers.forEach(h => allHeaders.add(h));
            fileResults.push({ file, headers, json });
            if (i === 0) firstFileRows = json;
          } catch (err) {
            console.error("파일 읽기 오류:", file.name, err);
          }
        }

        const headersArr = Array.from(allHeaders);
        setDetectedHeaders(headersArr);
        setRawJsonRows(firstFileRows);
        setParsedFilesInfo(fileResults);

        const autoMap = {};
        targetFields.forEach(field => {
          const matched = headersArr.find(h => 
            field.keywords.some(k => h.toLowerCase().replace(/\s+/g, '').includes(k.toLowerCase()))
          );
          autoMap[field.key] = matched || '';
        });

        setCustomKeyMap(autoMap);
        setIsProcessing(false);
        setStep(2);
        setMessage(`✅ 총 ${fileResults.length}개 파일 파싱 완료. 컬럼 매핑 및 정규화를 확인하세요.`);
      };

      const handleIngest = () => {
        if (!parsedFilesInfo.length) return;
        setIsProcessing(true);

        let updatedSales = [...salesData];
        const newLogs = [];

        parsedFilesInfo.forEach(({ file, json }, fileIdx) => {
          const newUploadId = Date.now() + fileIdx;
          const convertedRows = json.map((row, idx) => {
            const getRowVal = (mapKey, keywords) => {
              if (customKeyMap[mapKey] && row[customKeyMap[mapKey]] !== undefined && row[customKeyMap[mapKey]] !== '') {
                return String(row[customKeyMap[mapKey]]).trim();
              }
              for (const kw of keywords) {
                for (const key of Object.keys(row)) {
                  if (key.replace(/\s+/g, '').toLowerCase().includes(kw.replace(/\s+/g, '').toLowerCase())) {
                    if (row[key] !== undefined && row[key] !== '') return String(row[key]).trim();
                  }
                }
              }
              return '';
            };

            const dateVal = parseExcelDate(getRowVal('date', ['일자', '날짜', '영업일자', '판매일', '주문일', '출고일', '결제일']));
            const orderNum = getRowVal('order', ['주문번호', '전표번호', '주문전표번호', 'orderno']) || `ORD_${Date.now()}_${idx}`;
            
            // Priority 1: 외부몰 상품명 / 자사상품명
            const prodName = getRowVal('name', ['외부몰 상품명', '외부몰상품명', '자사상품명', '상품명', '품목명']) || '미지정 상품';
            
            // Priority 2: Product Code with fallback hash generation
            let prodCode = getRowVal('code', ['자사상품코드', '상품코드', 'sku코드', '품목코드', '외부몰상품코드']);
            if (!prodCode) {
              if (prodName !== '미지정 상품') {
                const hash = Math.abs(prodName.split('').reduce((a, b) => ((a << 5) - a) + b.charCodeAt(0), 0));
                prodCode = `SKU_${hash.toString(36).toUpperCase()}`;
              } else {
                prodCode = `SKU_UNMAPPED_${idx}`;
              }
            }

            // Priority 3: 브랜드 내역 우선 파싱
            const brandName = getRowVal('brand', ['브랜드 내역', '브랜드내역', '브랜드명', '자사브랜드', '브랜드']) || '기타 브랜드';
            const categoryL1 = getRowVal('category', ['카테고리', '대분류', '중분류']) || '의류/잡화';
            const channelName = getRowVal('channel', ['판매채널', '유통채널', '채널명', '채널']) || '자사몰';
            
            // Priority 4: Plant Code Mapping
            let rawStore = getRowVal('store', ['플랜트명', '플랜트', '지점명', '지점', '매장명', '매장']);
            let storeName = rawStore;
            if (rawStore && PLANT_MAP[rawStore.toUpperCase()]) {
              storeName = PLANT_MAP[rawStore.toUpperCase()];
            } else if (!storeName) {
              storeName = '본사';
            }

            const optionName = getRowVal('option', ['옵션명', '옵션', '규격', '색상']) || 'FREE';

            const qty = parseInt(getRowVal('qty', ['판매수량', '수량', '출고수량']) || '1', 10) || 0;
            let unitP = parseFloat(getRowVal('price', ['소비자가', '정가', '단가'])) || 0;
            let discP = parseFloat(getRowVal('disc', ['할인금액', '할인액'])) || 0;
            let saleP = parseFloat(getRowVal('salePrice', ['실판매가', '판매금액', '판매가', '결제금액'])) || 0;

            if (saleP === 0 && unitP > 0) saleP = unitP - discP;
            if (unitP === 0 && saleP > 0) unitP = saleP + discP;
            let costP = parseFloat(getRowVal('cost', ['원가', '공급가'])) || Math.round(saleP * 0.6);

            const dateParts = dateVal.split('-');
            const year = parseInt(dateParts[0]) || 2026;
            const month = parseInt(dateParts[1]) || 1;
            const day = parseInt(dateParts[2]) || 1;
            const monthStr = month < 10 ? `0${month}` : `${month}`;
            const yearmonth = `${year}-${monthStr}`;
            const dateId = parseInt(`${year}${monthStr}${day < 10 ? '0'+day : day}`);

            const grossRev = qty * unitP;
            const netRev = qty * saleP;
            const marginAmt = netRev - (qty * costP);
            const marginRt = netRev !== 0 ? (marginAmt / netRev) : 0;
            const discRt = grossRev !== 0 ? ((grossRev - netRev) / grossRev) : 0;

            return {
              saleId: newUploadId + idx,
              orderNumber: orderNum,
              fullDate: dateVal, dateId, yearmonth, yearweek: `${year}-W${Math.ceil((month*4)+(day/7))}`, year, month,
              productCode: prodCode, productName: prodName, brandName, categoryL1,
              channelName, storeName, optionName,
              quantity: qty, unitPrice: unitP, discountPrice: discP, salePrice: saleP,
              grossRevenue: grossRev, netRevenue: netRev, costPrice: costP,
              marginAmount: marginAmt, marginRate: marginRt, discountRate: discRt, uploadId: newUploadId
            };
          });

          let dupCount = 0;
          let newCount = 0;

          if (strategy === 'overwrite') {
            const incomingOrderSet = new Set(convertedRows.map(r => r.orderNumber));
            updatedSales = updatedSales.filter(s => !incomingOrderSet.has(s.orderNumber));
            updatedSales = [...updatedSales, ...convertedRows];
            newCount = convertedRows.length;
          } else if (strategy === 'skip') {
            const existingOrderSet = new Set(updatedSales.map(s => s.orderNumber));
            const filteredNew = convertedRows.filter(r => !existingOrderSet.has(r.orderNumber));
            dupCount = convertedRows.length - filteredNew.length;
            newCount = filteredNew.length;
            updatedSales = [...updatedSales, ...filteredNew];
          } else {
            updatedSales = [...updatedSales, ...convertedRows];
            newCount = convertedRows.length;
          }

          newLogs.push({
            id: newUploadId,
            filename: file.name,
            date: new Date().toLocaleString(),
            rowsTotal: convertedRows.length,
            rowsNew: newCount,
            rowsDup: dupCount,
            status: '완료',
            strategy: strategy === 'overwrite' ? '덮어쓰기' : strategy === 'skip' ? '건너뛰기' : '병합'
          });
        });

        setSalesData(updatedSales);
        setUploadHistory([...newLogs, ...uploadHistory]);
        setIsProcessing(false);
        setMessage(`🎉 저장 완료: ${parsedFilesInfo.length}개 파일 데이터베이스 연동 성공.`);
        setTimeout(() => onClose(), 800);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl p-5 w-full max-w-2xl shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-200 dark:border-zinc-800 pb-3">
              <h3 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <Icon name="upload-cloud" className="w-4 h-4 text-blue-500" /> 엑셀 파일 업로드 및 컬럼 매핑
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-4 h-4" /></button>
            </div>

            {step === 1 ? (
              <div 
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => { e.preventDefault(); if (e.dataTransfer.files) processFiles(e.dataTransfer.files); }}
                onClick={() => fileInputRef.current?.click()}
                className="border-2 border-dashed border-blue-400/50 dark:border-blue-500/30 hover:border-blue-500 rounded-xl p-6 text-center bg-blue-50/40 dark:bg-blue-900/10 cursor-pointer transition"
              >
                <input 
                  type="file" 
                  ref={fileInputRef} 
                  onChange={(e) => { if (e.target.files) { processFiles(e.target.files); e.target.value = ''; } }} 
                  accept=".xlsx,.xls,.csv" 
                  multiple 
                  className="hidden" 
                />
                <Icon name="file-spreadsheet" className="w-8 h-8 text-blue-500 mx-auto mb-2" />
                <p className="text-xs font-semibold text-slate-800 dark:text-zinc-200">엑셀 파일(.xlsx)을 끌어다 놓거나 클릭하여 여러 개 선택하세요.</p>
                <p className="text-[10px] text-slate-400 mt-1">SAP 원본 엑셀 파일을 업로드하면 자동으로 헤더 컬럼을 분석하여 매핑합니다.</p>
              </div>
            ) : (
              <div className="space-y-3">
                <div className="flex items-center justify-between bg-blue-50 dark:bg-blue-900/20 p-3 rounded-lg border border-blue-200 dark:border-blue-800 text-xs text-blue-800 dark:text-blue-300">
                  <span>감지된 컬럼 수: <strong>{detectedHeaders.length}개</strong> | 파싱 대상 파일: <strong>{parsedFilesInfo.length}개</strong></span>
                  <button onClick={() => setStep(1)} className="text-[11px] text-blue-600 dark:text-blue-400 hover:underline">← 파일 다시 선택</button>
                </div>

                <div className="space-y-1">
                  <span className="text-xs font-bold text-slate-700 dark:text-zinc-300">SAP 컬럼 수동/자동 매핑 설정</span>
                  <div className="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto p-2 bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-lg">
                    {targetFields.map(field => (
                      <div key={field.key} className="flex items-center justify-between text-xs gap-1">
                        <span className="text-slate-500 dark:text-zinc-400 w-28 truncate">{field.label}:</span>
                        <select 
                          value={customKeyMap[field.key] || ''} 
                          onChange={(e) => setCustomKeyMap({...customKeyMap, [field.key]: e.target.value})}

    const MonthlyTrendChart = ({ sales, theme }) => {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !sales.length) return;
        const monthMap = aggregateByField(sales, 'yearmonth');
        const labels = Object.keys(monthMap).sort();
        const revData = labels.map(m => monthMap[m].netRev);
        const qtyData = labels.map(m => monthMap[m].qty);

        const ctx = canvasRef.current.getContext('2d');
        if (chartRef.current) chartRef.current.destroy();

        const isDark = theme === 'dark';
        const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
        const textColor = isDark ? '#9ca3af' : '#64748b';

        chartRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [
              { label: '순매출액 (원)', data: revData, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.3, yAxisID: 'y' },
              { label: '판매수량 (개)', data: qtyData, borderColor: '#10b981', backgroundColor: 'transparent', borderDash: [4, 4], tension: 0.3, yAxisID: 'y1' }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              x: { ticks: { color: textColor, font: { size: 9 } }, grid: { color: gridColor } },
              y: { type: 'linear', position: 'left', ticks: { color: textColor, font: { size: 9 } }, grid: { color: gridColor } },
              y1: { type: 'linear', position: 'right', ticks: { color: textColor, font: { size: 9 } }, grid: { display: false } }
            },
            plugins: { legend: { labels: { color: textColor, font: { size: 10 } } } }
          }
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [sales, theme]);

      if (!sales.length) return <div className="h-60 flex items-center justify-center text-xs text-slate-400">데이터 없음</div>;
      return <div className="h-60 relative"><canvas ref={canvasRef}></canvas></div>;
    };

    const BrandShareChart = ({ sales, theme }) => {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !sales.length) return;
        const bMap = aggregateByField(sales, 'brandName');

        const data = Object.keys(bMap).map(k => bMap[k].netRev);

        const ctx = canvasRef.current.getContext('2d');
        if (chartRef.current) chartRef.current.destroy();

        chartRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels,
            datasets: [{ data, backgroundColor: ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#f43f5e', '#6366f1', '#14b8a6'] }]

          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { color: theme === 'dark' ? '#9ca3af' : '#64748b', font: { size: 10 } } } }

        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };

                </div>
              </div>
            </div>
          )}

          {tab === 'ai' && (
            <div className="p-4 rounded-xl glass-card space-y-3">
              <h3 className="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-1.5"><Icon name="sparkles" className="w-4 h-4 text-violet-500" /> AI 추천 액션</h3>
              <div className="p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-xs text-emerald-700 dark:text-emerald-300">
                <strong>권장 가이드:</strong> {invRisk.action} - {invRisk.status} 상태입니다. 주당 평균 소진 속도는 {invRisk.burnRate}개입니다.
              </div>
            </div>
          )}
        </div>
      );
    };

    const AnomalyCenterView = ({ allSales }) => {
      const anomalies = useMemo(() => AIService.anomaly.detect(allSales), [allSales]);

      return (
        <div className="p-4 rounded-xl glass-card space-y-3">
          <div className="flex items-center justify-between">
            <h3 className="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-2">
              <Icon name="alert-triangle" className="w-4 h-4 text-rose-500" /> 이상치 탐지 (표준편차 Z &gt; 3)
            </h3>
            <span className="text-xs text-slate-400">자동 검수</span>
          </div>
          <table className="w-full text-xs text-left">
            <thead className="bg-slate-100 dark:bg-zinc-900 text-slate-500 font-semibold">
              <tr><th className="p-2">발생일자</th><th className="p-2">상품코드</th><th className="p-2">이상치 유형</th><th className="p-2">기록값</th><th className="p-2 text-right">심각도</th></tr>
            </thead>
            <tbody className="divide-y divide-slate-200 dark:divide-zinc-800">
              {anomalies.length === 0 ? (
                <tr><td colSpan="5" className="p-4 text-center text-slate-400">검출된 데이터 이상치가 없습니다.</td></tr>
              ) : (
                anomalies.map((an, i) => (
                  <tr key={i} className="hover:bg-slate-100/50 dark:hover:bg-zinc-800/40">
                    <td className="p-2 font-mono">{an.date}</td>
                    <td className="p-2 font-mono text-blue-500">{an.sku}</td>
                    <td className="p-2 font-medium">{an.type}</td>
                    <td className="p-2 text-rose-500 font-bold">{an.value}</td>
                    <td className="p-2 text-right"><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${an.severity==='높음'?'bg-rose-500/20 text-rose-600':'bg-amber-500/20 text-amber-600'}`}>{an.severity}</span></td>
                  </tr>
                ))
              )}
            </tbody>
          </table>
        </div>
      );
    };

    const PurchaseRecommendationView = ({ sales }) => {
      const pCodes = useMemo(() => Array.from(new Set(sales.map(s => s.productCode))), [sales]);

      return (
        <div className="p-4 rounded-xl glass-card space-y-3">
          <h3 className="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-2">
            <Icon name="shopping-cart" className="w-4 h-4 text-emerald-500" /> AI 발주 추천 상품 List
          </h3>
          <table className="w-full text-xs text-left">
            <thead className="bg-slate-100 dark:bg-zinc-900 text-slate-500 font-semibold">
              <tr><th className="p-2">상품코드</th><th className="p-2">상품명</th><th className="p-2 text-right">누적판매량</th><th className="p-2 text-right">주당소진</th><th className="p-2 text-center">AI 추천행동</th></tr>
            </thead>
            <tbody className="divide-y divide-slate-200 dark:divide-zinc-800">
              {pCodes.length === 0 ? (
                <tr><td colSpan="5" className="p-4 text-center text-slate-400">업로드된 상품 데이터가 없습니다.</td></tr>
              ) : (
                pCodes.slice(0, 50).map(code => {
                  const pSales = sales.filter(s => s.productCode === code);
                  const pName = pSales[0]?.productName || code;
                  const totalQ = pSales.reduce((acc,s) => acc + s.quantity, 0);
                  const risk = AIService.inventory.assessRisk(pSales, 100, 0);
                  return (
                    <tr key={code} className="hover:bg-slate-100/50 dark:hover:bg-zinc-800/40">
                      <td className="p-2 font-mono text-blue-500">{code}</td>
                      <td className="p-2 font-medium">{pName}</td>
                      <td className="p-2 text-right">{totalQ.toLocaleString()}개</td>
                      <td className="p-2 text-right">{risk.burnRate}개</td>
                      <td className="p-2 text-center"><span className="px-2 py-0.5 rounded text-[10px] bg-blue-500/20 text-blue-600 font-bold">{risk.action}</span></td>
                    </tr>
                  );
                })
              )}
            </tbody>
          </table>
        </div>
      );
    };

    const ExecutiveReportView = ({ sales }) => {
      const kpi = useMemo(() => calculateKPIs(sales), [sales]);
      return (
        <div className="p-6 rounded-xl glass-card space-y-5 max-w-4xl mx-auto">
          <div className="flex items-center justify-between border-b pb-4 border-slate-200 dark:border-zinc-800">
            <div>
              <h1 className="text-lg font-bold text-slate-900 dark:text-white">경영진 월간 매출 리포트</h1>
              <p className="text-xs text-slate-400 mt-1">실시간 로우데이터 분석 결과 요약 보고서</p>
            </div>
            <button onClick={() => window.print()} className="no-print text-xs bg-violet-600 hover:bg-violet-700 text-white px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5">
              <Icon name="printer" className="w-3.5 h-3.5" /> 인쇄 / PDF 저장
            </button>
          </div>

          <div className="space-y-2">
            <h3 className="text-xs font-bold text-slate-900 dark:text-white uppercase tracking-wider">1. 핵심 경영 요약</h3>
            <p className="text-xs text-slate-700 dark:text-zinc-300 leading-relaxed bg-slate-100 dark:bg-zinc-900 p-3 rounded-lg">
              업로드된 실시간 데이터 기준 총 순매출액은 <strong>₩{Math.round(kpi.netRev).toLocaleString()}원</strong>이며, 전체 판매수량은 <strong>{kpi.qty.toLocaleString()}개</strong>입니다. 평균 마진율은 <strong>{kpi.marginRate}%</strong>를 기록하고 있습니다.
            </p>
          </div>
        </div>
      );
    };

    const AIChatModal = ({ onClose, sales }) => {
      const [query, setQuery] = useState('');
      const [reply, setReply] = useState('');

      const handleAsk = () => {
        if (!query.trim()) return;
        const res = AIService.nlp.search(query, sales);
        setReply(res);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl p-5 w-full max-w-md shadow-2xl space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <Icon name="sparkles" className="w-4 h-4 text-violet-500" /> AI 자연어 검색
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-4 h-4" /></button>
            </div>
            <div className="flex items-center gap-2">
              <input type="text" value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAsk()} placeholder="예: 매출 1위 상품은?" className="flex-1 bg-slate-100 dark:bg-zinc-950 border border-slate-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-xs outline-none" />
              <button onClick={handleAsk} className="bg-violet-600 hover:bg-violet-700 text-white text-xs px-3 py-2 rounded-lg font-semibold whitespace-nowrap">검색</button>
            </div>
            {reply && (
              <div className="p-3 rounded-lg bg-violet-500/10 border border-violet-500/20 text-xs text-violet-900 dark:text-violet-200">
                {reply}
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
